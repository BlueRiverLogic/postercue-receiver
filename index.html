                    broadcast('videoPreload', { pct: b.contiguousPct, bufferedSec: +b.be0.toFixed(1), durationSec: +b.dur.toFixed(1),
                                                elapsedSec: +elapsed.toFixed(1), rate: +rate.toFixed(2),
                                                ranges: b.ranges, endPct: b.pct, playhead: +(videoMedia.currentTime || 0).toFixed(1) });
                    tlog('info', 'preload ' + b.contiguousPct + '% contiguous (' + b.be0.toFixed(0) + '/' + b.dur.toFixed(0) +
                                 's, ' + b.ranges + ' ranges, end ' + b.pct + '%) elapsed=' + elapsed.toFixed(0) +
                                 's rate=' + rate.toFixed(1) + 'x realtime');
                    lastPct = b.contiguousPct; lastBe = b.be0; lastBeAt = now;
                }

                // Fully cached only when ONE contiguous range covers [0..duration].
                if (b.dur > 0 && b.bs <= 0.5 && b.be0 >= b.dur - 0.5) {
                    video.fullyBuffered = true;
                    broadcast('videoBuffered', { duration: +b.dur.toFixed(2), bufferedSec: +b.be0.toFixed(2),
                                                 pct: 100, elapsedSec: +elapsed.toFixed(1), viaPreload: true });
                    tlog('info', 'video FULLY buffered (contiguous) via seek-ahead in ' + elapsed.toFixed(1) + 's — safe to close sender');
                    reveal('fully-buffered');
                    return;
                }
                if (now - video.preloadStartAt > PRELOAD_TIMEOUT_MS) {
                    broadcast('videoPreloadTimeout', { pct: b.contiguousPct, elapsedSec: +elapsed.toFixed(1) });
                    tlog('error', 'preload TIMEOUT at ' + b.contiguousPct + '% contiguous after ' + elapsed.toFixed(0) + 's — streaming (NOT fully cached)');
                    reveal('timeout');
                    return;
                }

                // Seek-ahead: pin the playhead just behind the CONTIGUOUS-from-start
                // edge (be0), not the last range — jumping to the last range's end skips
                // bytes and leaves mid-file holes. Staying at be0 forces the engine to
                // extend [0..x] solid, so the file fills with no gaps.
                try {
                    if (b.dur > 0 && b.be0 > 0.1 && b.be0 < b.dur - 0.5) {
                        var target = Math.max(0, b.be0 - 0.05);
                        if (Math.abs((videoMedia.currentTime || 0) - target) > 0.1) videoMedia.currentTime = target;
                    }
                } catch (e) {}
            }

            videoMedia.oncanplay = null;
            videoMedia.onplaying = null;
            videoMedia.onprogress = preloadTick;
            videoMedia.onerror = function() {
                var err = videoMedia.error;
                tlog('error', 'video error code=' + (err && err.code) + ' ' + data.url);
                broadcast('videoError', { phase: 'load', code: err && err.code, url: data.url });
            };

            videoMedia.src = data.url;
            try { videoMedia.load(); } catch (e) {}
            // Play (muted, hidden) so the engine downloads; seek-ahead races it.
            var pp = videoMedia.play();
            if (pp && pp.catch) pp.catch(function(err) { tlog('error', 'preload play() rejected: ' + err); });
            // Steady driver — `progress` is platform-flaky on TV, so poll too.
            video.preloadTimer = setInterval(preloadTick, 250);

            tlog('info', 'video preload start (hidden seek-ahead): ' + data.url +
                         ' loop=' + loop + ' fill=' + (data.fill || 'contain') +
                         ' timeout=' + (PRELOAD_TIMEOUT_MS / 1000) + 's');
        }

        context.addCustomMessageListener(NAMESPACE, function(event) {
            var receivedAt = Date.now();
            inboundMsgCount++;   // every inbound custom message — the blob beat delta's this to expose delivery rate
            var data = event.data;
            if (typeof data === 'string') {
                data = JSON.parse(data);
            }

            if (data.action === 'show') {
                // A single image (album art, movie poster, auto-push) permanently
                // stops any running slideshow / motion / video and displays it via
                // the gapless double-buffered <img> swap — the previous surface is
                // held until the new image has DECODED, then torn down + revealed in
                // one synchronous turn (see showPosterImage). On a load failure the
                // current surface simply stays up.
                showPosterImage(data.url, event.senderId, receivedAt, null);
            }

            else if (data.action === 'motionPoster') {
                // Cast-side animated poster. See the Motion Poster engine above.
                startMotion(data);
                sendMessage(event.senderId, {
                    event: 'motionPosterStarted',
                    type: (data.particle && data.particle.type) || 'none',
                    fill: data.fill,
                    loopMs: motion.loopMs,
                    ts: Date.now(),
                    processingMs: Date.now() - receivedAt
                });
            }

            else if (data.action === 'showVideo') {
                // Real video on the hardware video plane (4K-capable, screensaver-
                // suppressing). Supersedes any image / slideshow / motion poster.
                //
                // With an `imageUrl` (gated still→video) bridge the swap: raise the
                // poster COVER on top, then start the video HIDDEN behind it and drop
                // the cover only once it's actually painting (see reveal). No black
                // flash, single decoder. Without one (test/motion clips) start direct.
                if (data.imageUrl) {
                    video.bridged = true;
                    showBridgeCover(data.imageUrl, function () { startVideo(data); });
                } else {
                    video.bridged = false;
                    startVideo(data);
                }
                sendMessage(event.senderId, {
                    event: 'videoStarted',
                    url: data.url,
                    loop: data.loop !== false,
                    ts: Date.now(),
                    processingMs: Date.now() - receivedAt
                });
            }

            else if (data.action === 'videoBlobBegin') { handleVideoBlobBegin(data); }
            else if (data.action === 'videoBlobChunk') { handleVideoBlobChunk(data); }
            else if (data.action === 'videoBlobEnd')   { handleVideoBlobEnd(data); }

            else if (data.action === 'setOrientation') {
                applyRotation(data.rotation || 0);
                // Keep a live motion poster upright too if orientation changes.
                // (Video is never rotated here — its pixels are pre-rotated by
                // the sender to keep the encoded frame landscape/decoder-safe.)
                if (motion.active) styleRotation(motionEl, data.rotation || 0);
                // Remember it for this device so the next cold start paints the
                // placeholder in the right orientation immediately (no flash).
                try { localStorage.setItem('pc_rotation', String(currentRotation)); } catch (e) {}
                sendMessage(event.senderId, {
                    event: 'orientationSet',
                    rotation: currentRotation,
                    ts: Date.now(),
                    processingMs: Date.now() - receivedAt
                });
            }

            else if (data.action === 'clear') {
                stopBlobBeat();       // abort any in-flight transfer's liveness ticker
                blobXfer = null;      // and drop its partial buffer
                clearSlideshow('clear-command');
                clearMotion('clear-command');
                clearVideo('clear-command');
                // Detach load/error handlers BEFORE clearing src —
                // setting src='' triggers onerror, which would fire
                // the stale handler from the last 'show' command and
                // send a spurious "Failed to load image" error.
                activeImg.onload = null;
                activeImg.onerror = null;
                standbyImg.onload = null;
                standbyImg.onerror = null;
                activeImg.classList.remove('active');
                standbyImg.classList.remove('active');
                activeImg.src = '';
                standbyImg.src = '';
                showSplash();   // portrait-aware idle placeholder (not a black screen)
                sendMessage(event.senderId, { event: 'cleared', ts: Date.now(), processingMs: Date.now() - receivedAt });
            }

            else if (data.action === 'testRotation') {
                // Diagnostic: cycle through all four rotation values (0, 90, 180, 270)
                // with the current image visible, pausing 5s on each. Overlays the
                // current rotation value so the user can identify which looks correct.
                var rotations = [0, 90, 180, 270];
                var overlay = document.createElement('div');
                overlay.style.cssText = 'position:fixed;top:20px;left:20px;z-index:999;' +
                    'color:#fff;font-size:48px;font-family:monospace;' +
                    'background:rgba(0,0,0,0.7);padding:12px 24px;border-radius:8px;';
                document.body.appendChild(overlay);
                var idx = 0;
                function nextRotation() {
                    if (idx >= rotations.length) {
                        document.body.removeChild(overlay);
                        // Restore original rotation
                        applyRotation(data.originalRotation || 0);
                        sendMessage(event.senderId, {
                            event: 'testRotationComplete',
                            tested: rotations,
                            ts: Date.now(),
                            processingMs: Date.now() - receivedAt
                        });
                        return;
                    }
                    var deg = rotations[idx];
                    overlay.textContent = 'CSS rotate(' + deg + 'deg)';
                    applyRotation(deg);
                    idx++;
                    setTimeout(nextRotation, 5000);
                }
                nextRotation();
            }

            else if (data.action === 'getVisibility') {
                // On-demand visibility query — used by the sender after
                // app restart to check if an existing receiver session
                // is hidden behind the home screen.
                sendMessage(event.senderId, {
                    event: 'visibility',
                    isVisible: receiverVisible,
                    documentHidden: document.hidden,
                    ts: Date.now(),
                    processingMs: Date.now() - receivedAt
                });
            }

            else if (data.action === 'slideshow') {
                startSlideshow(data);
                sendMessage(event.senderId, {
                    event: 'slideshowStarted',
                    total: (data.images || []).length,
                    ts: Date.now(),
                    processingMs: Date.now() - receivedAt
                });
            }

            else if (data.action === 'slideshowControl') {
                slideshowControl(data.op);
            }

            else if (data.action === 'replace') {
                // Swap the image set without ending the Cast session.
                startSlideshow(data);
                sendMessage(event.senderId, {
                    event: 'slideshowReplaced',
                    total: (data.images || []).length,
                    ts: Date.now(),
                    processingMs: Date.now() - receivedAt
                });
            }

            else if (data.action === 'getSlideshowStatus') {
                sendMessage(event.senderId, {
                    event: 'slideshowStatus',
                    active: slideshow.active,
                    paused: slideshow.paused,
                    mode: slideshow.mode,
                    index: slideshow.index,
                    total: slideshow.images.length,
                    loops: slideshow.loopCount,
                    durationMs: slideshow.durationMs,
                    uptimeMs: slideshow.active ? (Date.now() - slideshow.startedAt) : 0,
                    heap: heapStats(),
                    ts: Date.now(),
                    processingMs: Date.now() - receivedAt
                });
            }

            else if (data.action === 'getInfo') {
                var dpr = window.devicePixelRatio || 1;
                // Report everything about the display pipeline so we can
                // diagnose portrait vs landscape rendering on different TVs.
                var screenInfo = {};
                try {
                    screenInfo.screenWidth = window.screen.width;
                    screenInfo.screenHeight = window.screen.height;
                    screenInfo.screenAvailWidth = window.screen.availWidth;
                    screenInfo.screenAvailHeight = window.screen.availHeight;
                    if (window.screen.orientation) {
                        screenInfo.orientationType = window.screen.orientation.type;
                        screenInfo.orientationAngle = window.screen.orientation.angle;
                    }
                    screenInfo.outerWidth = window.outerWidth;
                    screenInfo.outerHeight = window.outerHeight;
                    screenInfo.docWidth = document.documentElement.clientWidth;
                    screenInfo.docHeight = document.documentElement.clientHeight;
                } catch(e) {
                    screenInfo.error = e.message;
                }
                sendMessage(event.senderId, {
                    event: 'info',
                    width: Math.round(window.innerWidth * dpr),
                    height: Math.round(window.innerHeight * dpr),
                    rotation: currentRotation,
                    devicePixelRatio: dpr,
                    screen: screenInfo,
                    ts: Date.now(),
                    processingMs: Date.now() - receivedAt
                });
            }
        });

        context.addEventListener(cast.framework.system.EventType.READY, function() {
            console.log('PosterCue receiver ready');
        });

        // PosterCue is a non-media receiver (static images, not streaming).
        // Two timeouts must be addressed to prevent unexpected disconnects:
        //
        // 1. disableIdleTimeout: The Cast platform kills receivers after ~5 min
        //    when no active media session exists. Since PosterCue never plays
        //    media, the platform always considers it "idle." This disables that
        //    platform-level idle kill entirely. Google's docs: "should only be
        //    used for non-media apps" — which is exactly what PosterCue is.
        //
        // 2. maxInactivity: Sender↔receiver heartbeat timeout. How long the
        //    receiver waits without hearing from the sender app before closing.
        //    Set to 86400s (24 hours) so the session survives long periods
        //    between image pushes. Minimum is 5s (0 breaks connections).
        var options = new cast.framework.CastReceiverOptions();
        options.disableIdleTimeout = true;
        options.maxInactivity = 86400;
        context.start(options);
    </script>
</body>
</html>
