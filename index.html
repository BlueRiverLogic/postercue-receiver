<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; }
        body {
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #splash {
            position: absolute;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        #splash svg {
            width: 200px;
            height: 200px;
            opacity: 0.6;
        }
        #splash .label {
            position: absolute;
            bottom: 15%;
            color: #555;
            font-family: -apple-system, Helvetica Neue, Arial, sans-serif;
            font-size: 24px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        #canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            display: none;
        }

        .layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            visibility: hidden;
        }
        .layer.active {
            visibility: visible;
        }

        /* ── Motion poster layers (Cast-side animation) ──────────────────
           A looping "motion poster" rendered entirely on the receiver from a
           recipe + two plain <img> layers + a self-drawn <canvas> particle
           layer. Deliberately NO WebGL / no canvas reads of the poster pixels
           (cross-origin/CORS loads don't work over the plain-HTTP ingest the
           Cast runtime allows — see the slideshow note in the script). */
        #motion {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: none; overflow: hidden; background: #000;
            z-index: 6;
            /* Promote the whole rotated container to its own GPU layer. In
               portrait (90° rotation) the container's transform is otherwise
               re-rasterized with the whole animating subtree every frame,
               which roughly halved fps vs landscape. As a promoted layer the
               rotation is a one-time compositor transform. */
            will-change: transform;
            backface-visibility: hidden;
        }
        #motion.active { display: block; }
        #mp-fill, #mp-bg, #mp-subject {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            will-change: transform;   /* GPU-composite the camera/parallax transforms */
        }
        /* Blurred, zoomed copy behind a portrait poster on a landscape TV.
           A <canvas> painted with a tiny (≈64px) cover-cropped copy of the bg,
           then upscaled to fill: the upscale IS the blur, so we avoid a
           full-screen per-frame CSS blur() (the expensive part). brightness
           is cheap and kept. */
        #mp-fill    { transform: scale(1.25); filter: brightness(0.55); image-rendering: auto; }
        #mp-bg      { object-fit: contain; }
        #mp-subject { object-fit: contain; }
        #mp-particles { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        /* Additive diagonal light sweep. */
        #mp-sweep   { position: absolute; top: 0; left: 0; width: 100%; height: 100%;
                      mix-blend-mode: screen; pointer-events: none; opacity: 0; will-change: transform; }
        /* Warmth/colour grade wash. */
        #mp-grade   { position: absolute; top: 0; left: 0; width: 100%; height: 100%;
                      pointer-events: none; opacity: 0; }
        /* Vignette darkening at the edges. */
        #mp-vignette{ position: absolute; top: 0; left: 0; width: 100%; height: 100%;
                      pointer-events: none; opacity: 0;
                      background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.92) 130%); }

        /* ── Video surface (hardware video plane) ────────────────────────
           A real <video> element decoded by the device's dedicated video
           hardware — the ONLY path to true 4K on Cast (the <img>/<canvas>
           graphics plane is platform-capped at ~1080p), and the only thing
           that keeps built-in TV screensavers (e.g. LG webOS) from starting
           over otherwise-static content. Rotated as a whole like #motion so
           portrait displays stay upright. */
        #video {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: none; overflow: hidden; background: #000;
            z-index: 8;
            will-change: transform;
            backface-visibility: hidden;
        }
        #video.active { display: block; }
        #video-el {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain; background: #000;
        }

        /* ── Poster cover (still→video bridge) ───────────────────────────
           Top-most layer. For a gated still→video swap the sender includes the
           poster as `imageUrl`; we raise this cover FIRST, then warm up + play
           the <video> HIDDEN BEHIND it, and drop the cover only once the video
           has presented a real frame (requestVideoFrameCallback). Revealing the
           video by REMOVING the cover — never by stacking the video on top — is
           what avoids the black warmup frame. Structured like #canvas so
           portrait posters rotate upright identically. */
        #bridge {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: none; z-index: 11; background: #000;
            /* Compositing hints: promote the cover to its own GPU layer so its
               z-index can stack ABOVE the hardware video plane. On Chromecast/
               webOS the <video> decodes to a hardware overlay that ignores DOM
               z-index unless the competing DOM layer is itself GPU-composited.
               The translateZ(0) is (re)applied in showBridgeCover() too, because
               styleRotation() overwrites `transform` for portrait. */
            will-change: transform;
            backface-visibility: hidden;
            transform: translateZ(0);
        }
        #bridge.active { display: block; }
    </style>
</head>
<body>
    <!-- Splash screen shown until first image arrives -->
    <div id="splash">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="5" width="80" height="90" rx="4" stroke="#555" stroke-width="2"/>
            <rect x="16" y="11" width="68" height="72" rx="2" stroke="#444" stroke-width="1"/>
            <circle cx="50" cy="47" r="12" stroke="#555" stroke-width="1.5"/>
            <path d="M50 35 L50 59 M38 47 L62 47" stroke="#555" stroke-width="1"/>
        </svg>
        <div class="label">PosterCue</div>
    </div>

    <!-- Image display layers -->
    <div id="canvas">
        <img id="img1" class="layer active">
        <img id="img2" class="layer">
    </div>

    <!-- Motion poster layers (see #motion CSS + the Motion Poster engine).
         Back-to-front: blurred fill, background poster, subject cutout,
         particle canvas, light sweep, colour grade, vignette. -->
    <div id="motion">
        <canvas id="mp-fill"></canvas>
        <img    id="mp-bg">
        <img    id="mp-subject">
        <canvas id="mp-particles"></canvas>
        <div    id="mp-sweep"></div>
        <div    id="mp-grade"></div>
        <div    id="mp-vignette"></div>
    </div>

    <!-- Video surface: real <video> on the hardware video plane (4K-capable,
         screensaver-suppressing). muted+playsinline+autoplay so it can start
         without a user gesture; loop for seamless keep-alive / motion loops. -->
    <div id="video">
        <video id="video-el" muted loop autoplay playsinline preload="auto"></video>
    </div>

    <!-- Poster cover for the still→video bridge (see #bridge CSS). Sits above
         everything; the video is revealed by hiding this, not by stacking on top. -->
    <div id="bridge"><img id="bridge-img" class="layer active"></div>

    <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <script>
        var context = cast.framework.CastReceiverContext.getInstance();
        var NAMESPACE = 'urn:x-cast:com.postercue';

        var splash = document.getElementById('splash');
        var canvas = document.getElementById('canvas');
        var activeImg = document.getElementById('img1');
        var standbyImg = document.getElementById('img2');
        var currentRotation = 0;

        // Restore the last orientation this device used, applied on load BEFORE
        // first paint. The Cast viewport is always landscape, so without this the
        // splash paints sideways on a portrait display until the app's
        // setOrientation message arrives over the network (~hundreds of ms) — a
        // visible flash. A portrait display that ran at 90° last time now paints
        // the placeholder upright instantly. (applyRotation is a hoisted function
        // declaration, so calling it here — before its textual definition — is fine.)
        try {
            var savedRotation = parseInt(localStorage.getItem('pc_rotation') || '0', 10);
            if (!isNaN(savedRotation) && savedRotation !== 0) {
                applyRotation(savedRotation);
            }
        } catch (e) {}

        // ── Receiver Visibility Tracking ─────────────────────────────
        //
        // The receiver detects when it's hidden (Home button, HDMI input
        // switch, TV standby) and signals the iOS sender via the custom
        // channel. The sender uses this to decide whether to disconnect
        // and reconnect (triggering CEC foreground launch) on the next
        // image push, instead of pushing into a hidden receiver.
        //
        // Three independent detection sources:
        //   1. Page Visibility API  — Home button, launcher overlay
        //   2. VISIBILITY_CHANGED   — HDMI input switch, TV power
        //   3. STANDBY_CHANGED      — TV standby enter/exit
        //
        // Deduplication: only sends when receiverVisible actually
        // changes, since multiple sources may fire simultaneously
        // (e.g. standby triggers both STANDBY_CHANGED and
        // document.visibilitychange on some devices).

        var receiverVisible = true;

        function broadcastVisibility(isVisible, reason) {
            if (isVisible === receiverVisible) return;
            receiverVisible = isVisible;
            var msg = {
                event: 'visibilityChanged',
                isVisible: isVisible,
                reason: reason,
                ts: Date.now()
            };
            var senders = context.getSenders();
            for (var i = 0; i < senders.length; i++) {
                context.sendCustomMessage(NAMESPACE, senders[i].id, msg);
            }
            console.log('PosterCue visibility: ' + (isVisible ? 'VISIBLE' : 'HIDDEN') + ' reason=' + reason);
        }

        // Source 1: Page Visibility API — detects Home button press,
        // launcher overlay, and any other Android activity foregrounding
        // over the Cast receiver. This is the primary signal for the
        // "Home button hides receiver" scenario.
        document.addEventListener('visibilitychange', function() {
            broadcastVisibility(!document.hidden,
                document.hidden ? 'documentHidden' : 'documentVisible');
        });

        // Memory hygiene: when the RECEIVER itself is backgrounded (Home button on
        // the streamer, launcher overlay), it's no longer showing anything, so free a
        // resident blob show after a short grace period. Debounced — a brief overlay
        // or accidental Home press that returns within the window keeps the show.
        //
        // This does NOT affect survive-app-close: when the *phone* (sender) closes, the
        // receiver stays FOREGROUND (document.hidden = false) and keeps playing — only
        // the receiver going to background trips this. showSplash() tears down video
        // (revoking the Blob), slideshow, and motion, so the ~45 MB is released.
        var bgClearTimer = null;
        var BG_CLEAR_GRACE_MS = 20000;
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                if (bgClearTimer) return;
                bgClearTimer = setTimeout(function() {
                    bgClearTimer = null;
                    if (!document.hidden) return;   // came back within grace — keep it
                    tlog('info', 'receiver backgrounded > ' + (BG_CLEAR_GRACE_MS / 1000) + 's — clearing to free memory');
                    showSplash();
                }, BG_CLEAR_GRACE_MS);
            } else if (bgClearTimer) {
                clearTimeout(bgClearTimer); bgClearTimer = null;
            }
        });

        // Source 2: Cast SDK VISIBILITY_CHANGED — fires when the HDMI
        // input changes (user switches TV input away from Cast device)
        // or the TV powers off. Distinct from Page Visibility API which
        // tracks the Android app lifecycle, not the HDMI signal.
        context.addEventListener(
            cast.framework.system.EventType.VISIBILITY_CHANGED,
            function(event) {
                broadcastVisibility(event.isVisible,
                    event.isVisible ? 'hdmiInputActive' : 'hdmiInputChanged');
            }
        );

        // Source 3: Cast SDK STANDBY_CHANGED — fires when the TV enters
        // or exits standby mode (screen on/off). Complements the sender-
        // side GCKCastDeviceStatusListener standbyStatus callback.
        context.addEventListener(
            cast.framework.system.EventType.STANDBY_CHANGED,
            function(event) {
                broadcastVisibility(!event.isStandby,
                    event.isStandby ? 'standby' : 'standbyExit');
            }
        );

        // Apply an orientation transform to a single element. Shared by the
        // image canvas AND the idle splash so the PosterCue placeholder is
        // upright on portrait displays — not just the photos.
        function styleRotation(el, deg) {
            var transform = '';
            if (deg === 90) {
                transform = 'rotate(90deg) translateY(-100%)';
                el.style.transformOrigin = 'top left';
                el.style.width = '100vh';
                el.style.height = '100vw';
            } else if (deg === 270) {
                transform = 'rotate(270deg) translateX(-100%)';
                el.style.transformOrigin = 'top left';
                el.style.width = '100vh';
                el.style.height = '100vw';
            } else if (deg === 180) {
                transform = 'rotate(180deg)';
                el.style.transformOrigin = 'center center';
                el.style.width = '100vw';
                el.style.height = '100vh';
            } else {
                transform = '';
                el.style.transformOrigin = 'center center';
                el.style.width = '100vw';
                el.style.height = '100vh';
            }
            el.style.transform = transform;
        }

        function applyRotation(deg) {
            currentRotation = deg;
            styleRotation(canvas, deg);
            styleRotation(splash, deg);
        }

        // Return the display to the branded idle placeholder (portrait-aware).
        // Used when a slideshow is stopped or the display is cleared, instead of
        // leaving the screen black.
        function showSplash() {
            // The splash is the idle "nothing is showing" state, so make it a
            // clean slate: tear down any motion poster (which sits above the
            // canvas at z-index 6) and any running slideshow. Both are safe /
            // idempotent no-ops when inactive. Without the clearMotion, stopping
            // a slideshow (or clearing) could leave a motion poster superimposed
            // over the placeholder.
            clearMotion('splash');
            clearSlideshow('splash');
            clearVideo('splash');
            hideBridgeCover();
            styleRotation(splash, currentRotation);
            splash.style.display = 'flex';
            canvas.style.display = 'none';
        }

        function sendMessage(senderId, payload) {
            context.sendCustomMessage(NAMESPACE, senderId, payload);
        }

        // ── CueTheShow: logging, telemetry & memory diagnostics ──────────
        //
        // The slideshow runs autonomously on the receiver after the iOS app
        // closes, so the receiver is our only eyes on what's happening. These
        // helpers give us (a) a leveled on-device log (visible via chrome://
        // inspect) and (b) telemetry pushed back to any still-connected sender
        // so it lands in PosterCue's Debug Logs during testing.

        var LOG_LEVELS = { error: 0, info: 1, verbose: 2 };
        var logLevel   = LOG_LEVELS.info;   // raised to verbose per-slideshow via msg.verbose
        var logRing    = [];                // last N lines, for on-device inspection
        var LOG_RING_MAX = 200;

        function tlog(level, msg) {
            if (LOG_LEVELS[level] > logLevel) return;
            var line = '[' + level + '] ' + msg;
            logRing.push(line);
            if (logRing.length > LOG_RING_MAX) logRing.shift();
            console.log('PosterCue ' + line);
        }

        // Chromium-only heap figures. IMPORTANT: this is the JS heap, NOT the
        // decoded-image / GPU memory where the slideshow frames actually live —
        // so treat it as a trend signal, not ground truth. The authoritative
        // OOM evidence is the sender-side silence watchdog (heartbeats stop).
        function heapStats() {
            try {
                var m = window.performance && window.performance.memory;
                if (!m) return null;
                return {
                    used:  m.usedJSHeapSize,
                    total: m.totalJSHeapSize,
                    limit: m.jsHeapSizeLimit,
                    pct:   m.jsHeapSizeLimit ? Math.round(m.usedJSHeapSize / m.jsHeapSizeLimit * 100) : null
                };
            } catch (e) { return null; }
        }

        // Broadcast a telemetry event to every connected sender (the triggering
        // sender may have closed, so we don't target a single id).
        function broadcast(event, extra) {
            var msg = { event: event, ts: Date.now() };
            if (extra) { for (var k in extra) { msg[k] = extra[k]; } }
            var senders = context.getSenders();
            for (var i = 0; i < senders.length; i++) {
                try { context.sendCustomMessage(NAMESPACE, senders[i].id, msg); } catch (e) {}
            }
        }

        // Best-effort crash reporting: a real OOM kills the page before it can
        // speak, but JS-level errors fire these first — ship a 'fatal' out
        // synchronously so the sender at least learns what happened.
        window.addEventListener('error', function(e) {
            tlog('error', 'window.onerror: ' + (e && e.message));
            broadcast('fatal', { message: String(e && e.message), source: e && e.filename, line: e && e.lineno });
        });
        window.addEventListener('unhandledrejection', function(e) {
            var reason = (e && e.reason) ? (e.reason.message || String(e.reason)) : 'unknown';
            tlog('error', 'unhandledrejection: ' + reason);
            broadcast('fatal', { message: 'unhandledrejection: ' + reason });
        });

        // ── CueTheShow slideshow engine ──────────────────────────────────
        //
        // Strategy (proven primitive only): preload every image into its own
        // plain <img> layer inside #canvas — no crossOrigin, no fetch, no
        // canvas pixel reads — which is the only ingest the Cast runtime allows
        // over plain HTTP. Once loaded, the decoded frames live in the DOM and
        // survive the iOS app / LocalHTTPServer going away, so the receiver can
        // cycle them on its own timer indefinitely. The cost is memory: N
        // decoded frames held at once — which is exactly what the heap/heartbeat
        // telemetry above lets us watch as we ramp the image count up.

        var slideshow = {
            active: false,
            paused: false,
            mode: 'sequential',
            durationMs: 30000,
            loop: true,
            images: [],         // [{ id, url, el, loaded }]
            index: -1,
            loopCount: 0,
            timer: null,
            heartbeat: null,
            startedAt: 0,
            lastShownId: null,
            lastMemWarnAt: 0
        };

        // Tear the slideshow down and free every decoded frame.
        function clearSlideshow(reason) {
            if (slideshow.timer)     { clearInterval(slideshow.timer);     slideshow.timer = null; }
            if (slideshow.heartbeat) { clearInterval(slideshow.heartbeat); slideshow.heartbeat = null; }
            for (var i = 0; i < slideshow.images.length; i++) {
                var el = slideshow.images[i].el;
                if (el) {
                    el.onload = null; el.onerror = null; el.src = '';
                    if (el.parentNode) el.parentNode.removeChild(el);
                }
            }
            var hadImages = slideshow.images.length;
            slideshow.active = false;
            slideshow.paused = false;
            slideshow.images = [];
            slideshow.index = -1;
            slideshow.loopCount = 0;
            slideshow.lastShownId = null;
            if (hadImages) tlog('info', 'slideshow cleared (' + reason + '), freed ' + hadImages + ' layers');
        }

        function checkMemory() {
            var heap = heapStats();
            if (!heap || heap.pct === null) return;
            if (heap.pct >= 80 && (Date.now() - slideshow.lastMemWarnAt) > 15000) {
                slideshow.lastMemWarnAt = Date.now();
                tlog('error', 'MEMORY WARNING heap ' + heap.pct + '%');
                broadcast('memoryWarning', { heap: heap, usagePct: heap.pct });
            }
        }

        function sendHeartbeat() {
            if (!slideshow.active) return;
            broadcast('slideshowHeartbeat', {
                index:    slideshow.index,
                total:    slideshow.images.length,
                mode:     slideshow.mode,
                loops:    slideshow.loopCount,
                paused:   slideshow.paused,
                uptimeMs: Date.now() - slideshow.startedAt,
                heap:     heapStats()
            });
        }

        // Show the next frame. Instant cut (hard swap) — no crossfade.
        function advanceSlideshow() {
            if (!slideshow.active || slideshow.paused) return;
            var loaded = slideshow.images.filter(function(it) { return it.loaded && it.el; });
            if (loaded.length === 0) return;

            var next;
            if (slideshow.mode === 'shuffle') {
                if (loaded.length === 1) {
                    next = loaded[0];
                } else {
                    do { next = loaded[Math.floor(Math.random() * loaded.length)]; }
                    while (next.id === slideshow.lastShownId);   // avoid back-to-back repeat
                }
            } else {
                var prev = slideshow.index;
                slideshow.index = (slideshow.index + 1) % loaded.length;
                if (slideshow.index === 0 && prev >= 0) slideshow.loopCount++;
                next = loaded[slideshow.index];
            }

            for (var i = 0; i < slideshow.images.length; i++) {
                if (slideshow.images[i].el) slideshow.images[i].el.classList.remove('active');
            }
            next.el.classList.add('active');
            slideshow.lastShownId = next.id;

            if (logLevel >= LOG_LEVELS.verbose) {
                broadcast('slideshowAdvanced', { index: slideshow.index, id: next.id, heap: heapStats() });
            }
            checkMemory();
        }

        function startSlideshow(data) {
            clearSlideshow('restart');               // tear down any prior show first
            clearMotion('slideshow');                // and any running motion poster
            clearVideo('slideshow');                 // …and any playing video
            hideBridgeCover();

            // Hide the single-image layers; the slideshow uses its own layers
            // inside the same #canvas, so it inherits orientation/rotation.
            activeImg.classList.remove('active');
            standbyImg.classList.remove('active');
            splash.style.display = 'none';
            canvas.style.display = 'block';

            logLevel            = data.verbose ? LOG_LEVELS.verbose : LOG_LEVELS.info;
            slideshow.mode      = (data.mode === 'shuffle') ? 'shuffle' : 'sequential';
            slideshow.durationMs = Math.max(2000, data.durationMs || 30000);
            slideshow.loop      = data.loop !== false;
            slideshow.startedAt = Date.now();
            slideshow.active    = true;
            slideshow.paused    = false;

            var list  = data.images || [];
            var total = list.length;
            tlog('info', 'slideshow start: ' + total + ' images, mode=' + slideshow.mode +
                         ', duration=' + slideshow.durationMs + 'ms, verbose=' + (logLevel === LOG_LEVELS.verbose));

            if (total === 0) {
                broadcast('slideshowError', { phase: 'preload', message: 'empty image list' });
                clearSlideshow('empty');
                return;
            }

            var loaded = 0, failed = 0, settled = 0;

            function onSettled() {
                settled++;
                if (settled < total) return;
                var heap = heapStats();
                tlog('info', 'slideshow ready: ' + loaded + ' loaded, ' + failed + ' failed' +
                             (heap ? ', heap ' + heap.pct + '%' : ''));
                broadcast('slideshowReady', { total: total, loaded: loaded, failed: failed, heap: heap });
                checkMemory();
                if (loaded === 0) {
                    broadcast('slideshowError', { phase: 'preload', message: 'no images loaded' });
                    clearSlideshow('all-failed');
                    return;
                }
                // Kick off the autonomous loop — from here the sender can close.
                slideshow.index = -1;
                advanceSlideshow();
                slideshow.timer     = setInterval(advanceSlideshow, slideshow.durationMs);
                slideshow.heartbeat = setInterval(sendHeartbeat, 30000);  // throttled health beat
            }

            for (var i = 0; i < total; i++) {
                (function(item, idx) {
                    var el = document.createElement('img');
                    el.className = 'layer';
                    el.onload = function() {
                        item.loaded = true; loaded++;
                        tlog('verbose', 'preloaded [' + (idx + 1) + '/' + total + '] ' + item.id);
                        broadcast('slideshowLoading', { loaded: loaded, total: total, id: item.id });
                        onSettled();
                    };
                    el.onerror = function() {
                        item.loaded = false; failed++;
                        tlog('error', 'preload FAILED [' + (idx + 1) + '/' + total + '] ' + item.id + ' ' + item.url);
                        broadcast('imageLoadError', { url: item.url, index: idx, id: item.id });
                        onSettled();
                    };
                    item.el = el;
                    canvas.appendChild(el);
                    el.src = item.url;       // plain HTTP <img> load — the proven primitive
                })(list[i], i);
            }
            slideshow.images = list;
        }

        function slideshowControl(op) {
            if (op === 'pause')  { slideshow.paused = true;  tlog('info', 'slideshow paused');  broadcast('slideshowPaused',  {}); }
            else if (op === 'resume') { slideshow.paused = false; tlog('info', 'slideshow resumed'); broadcast('slideshowResumed', {}); }
            else if (op === 'stop')   { clearSlideshow('stop-command'); showSplash(); broadcast('slideshowStopped', {}); }
        }

        // ══ Motion Poster engine ═════════════════════════════════════════
        //
        // Renders a looping "motion poster" on the receiver from a compact
        // recipe (see the iOS MotionRecipe contract) plus two plain <img>
        // layers (background + lifted subject PNG) and a self-drawn <canvas>
        // particle layer.
        //
        // Design constraints (why it looks the way it does):
        //   • Plain <img> ingest ONLY. Poster images arrive over plain HTTP
        //     from the phone; cross-origin/CORS/canvas-reads of them do not
        //     work on the Cast runtime (same finding as the slideshow above).
        //     So we never sample the poster's pixels — the canvas only draws
        //     OUR OWN generated particle sprites, which never taint anything.
        //   • Effects that would need to read poster pixels (heat shimmer,
        //     energy-flow, depth displacement) are NOT rendered here. What we
        //     do render: Ken-Burns camera, subject parallax, particles, colour
        //     grade, vignette, and a diagonal light sweep.
        //   • All motion is a pure function of a loop phase (0..1), so it loops
        //     seamlessly regardless of frame rate.
        //   • ES5 only (var/function, no template literals) for older sticks.

        var motionEl    = document.getElementById('motion');
        var mpFill      = document.getElementById('mp-fill');
        var mpBg        = document.getElementById('mp-bg');
        var mpSubject   = document.getElementById('mp-subject');
        var mpParticles = document.getElementById('mp-particles');
        var mpSweep     = document.getElementById('mp-sweep');
        var mpGrade     = document.getElementById('mp-grade');
        var mpVignette  = document.getElementById('mp-vignette');

        var motion = {
            active: false,
            raf: 0,
            startTs: 0,
            lastTs: 0,
            loopMs: 12000,
            recipe: null,
            particles: [],
            pctx: null,          // 2D context of the particle canvas
            sprite: null,        // pre-rendered soft dot (fast drawImage, no per-particle gradients)
            spriteAdditive: false,
            // debug / telemetry
            frames: 0,
            fpsWindowStart: 0,
            fpsWindowFrames: 0,
            fps: 0,
            heartbeat: null,
            bgLoaded: false,
            subjectLoaded: false
        };

        function rand(a, b) { return a + Math.random() * (b - a); }

        // Paint the blurred-fill layer: draw the bg cover-cropped into a tiny
        // (64×36) canvas backing, which CSS then upscales to fill the screen.
        // The heavy bilinear upscale reads as a soft blur for free — far
        // cheaper than a full-screen per-frame CSS blur(40px). Drawing a
        // cross-origin <img> taints the canvas, but we only ever DISPLAY it
        // (never read pixels), which is allowed. Static: painted once per push.
        function paintFill(img) {
            var W = 64, H = 36;   // 16:9 backing; the container is 1920×1080 pre-rotation
            var iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
            if (!iw || !ih || !mpFill.getContext) return;
            mpFill.width = W; mpFill.height = H;
            var fctx = mpFill.getContext('2d');
            var scale = Math.max(W / iw, H / ih);   // cover
            var dw = iw * scale, dh = ih * scale;
            fctx.clearRect(0, 0, W, H);
            fctx.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);
        }

        // Tear the motion poster down and free its layers. Safe to call anytime.
        function clearMotion(reason) {
            if (!motion.active && motion.raf === 0) return;
            if (motion.raf)       { cancelAnimationFrame(motion.raf); motion.raf = 0; }
            if (motion.heartbeat) { clearInterval(motion.heartbeat);  motion.heartbeat = null; }
            motion.active = false;
            motion.particles = [];
            mpBg.onload = null; mpBg.onerror = null; mpBg.src = '';
            mpSubject.onload = null; mpSubject.onerror = null; mpSubject.src = '';
            if (mpFill.getContext) { mpFill.getContext('2d').clearRect(0, 0, mpFill.width, mpFill.height); }
            motionEl.classList.remove('active');
            tlog('info', 'motion cleared (' + (reason || '') + ')');
        }

        // Nominal on-screen particle count per type (scaled by density).
        function particleBaseCount(type) {
            if (type === 'embers')  return 90;
            if (type === 'dust')    return 70;
            if (type === 'snow')    return 120;
            if (type === 'rain')    return 200;
            if (type === 'sparkle') return 110;
            return 0;
        }

        // Pre-render a soft radial dot once; drawImage'ing it per particle is far
        // cheaper than building a gradient every frame (matters on weak sticks).
        function makeSoftSprite(color) {
            var s = 64;
            var c = document.createElement('canvas'); c.width = s; c.height = s;
            var g = c.getContext('2d');
            var grad = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
            grad.addColorStop(0, 'rgba(' + color + ',1)');
            grad.addColorStop(1, 'rgba(' + color + ',0)');
            g.fillStyle = grad;
            g.fillRect(0, 0, s, s);
            return c;
        }

        // Choose an ember seed point. If the recipe has hot regions and placement
        // isn't 'fullFrame', seed near a random hot region (the "fire"); else seed
        // across the lower half (embers rise). hotRegions are y-DOWN normalized.
        function emberSeed(pc, w, h) {
            var regions = pc.hotRegions || [];
            var useRegions = (pc.placement !== 'fullFrame') && regions.length > 0 &&
                             (pc.hotStrength == null || pc.hotStrength >= 0.3);
            if (useRegions) {
                var r = regions[Math.floor(Math.random() * regions.length)];
                return { x: r.x * w + rand(-0.12, 0.12) * w, y: r.y * h + rand(-0.06, 0.06) * h };
            }
            return { x: rand(0, w), y: rand(0.5, 1.0) * h };
        }

        // Create one particle. dt-based velocities are in px per millisecond.
        function spawnParticle(type, pc, w, h, initial) {
            var sizeMult  = (pc.size == null)  ? 1   : pc.size;
            var speedMult = (pc.speed == null) ? 0.5 : pc.speed;
            var p = { type: type, additive: false, streak: false, baseAlpha: 0.5 };

            if (type === 'embers') {
                var s = emberSeed(pc, w, h);
                p.x = s.x; p.y = s.y;
                p.vx = rand(-8, 8) / 1000;
                p.vy = -(40 + 80 * speedMult) / 1000;         // upward
                p.size = rand(2, 5) * sizeMult;
                p.life = initial ? rand(0, 3000) : 0;
                p.maxLife = rand(2500, 5000);
                p.additive = true;
            } else if (type === 'dust') {
                p.x = rand(0, w); p.y = rand(0, h);
                var a = rand(0, Math.PI * 2), sp = (6 + 14 * speedMult) / 1000;
                p.vx = Math.cos(a) * sp; p.vy = Math.sin(a) * sp;
                p.size = rand(18, 52) * sizeMult;
                p.life = initial ? rand(0, 9000) : 0;
                p.maxLife = rand(8000, 12000);
                p.baseAlpha = 0.26;
            } else if (type === 'snow') {
                p.x = rand(0, w); p.y = initial ? rand(0, h) : rand(-0.1, 0) * h;
                p.vx = rand(-10, 20) / 1000; p.vy = (30 + 50 * speedMult) / 1000;
                p.size = rand(2, 5) * sizeMult;
                p.life = 0; p.maxLife = 9e9;                  // recycled by going off-screen
                p.baseAlpha = 0.85;
            } else if (type === 'rain') {
                p.x = rand(0, w); p.y = initial ? rand(0, h) : rand(-0.1, 0) * h;
                p.vx = 40 / 1000; p.vy = (700 + 500 * speedMult) / 1000;
                p.size = rand(8, 16) * sizeMult;
                p.life = 0; p.maxLife = 9e9;
                p.baseAlpha = 0.35; p.streak = true;
            } else if (type === 'sparkle') {
                p.x = rand(0, w); p.y = rand(0, h);
                p.vx = rand(-5, 5) / 1000; p.vy = rand(-5, 5) / 1000;
                p.size = rand(1.5, 4) * sizeMult;
                p.life = initial ? rand(0, 1600) : 0;
                p.maxLife = rand(1200, 2000);
                p.additive = true;
            }
            return p;
        }

        // Size the particle canvas to the viewport and seed the field.
        // DPR is pinned to 1 (1920x1080) to keep cheap sticks smooth.
        function setupParticles(pc) {
            var w = Math.round(window.innerWidth);
            var h = Math.round(window.innerHeight);
            mpParticles.width = w;
            mpParticles.height = h;
            motion.pctx = mpParticles.getContext('2d');
            motion.particles = [];

            var type = pc.type || 'none';
            if (type === 'none') { motion.sprite = null; tlog('info', 'motion particles: none'); return; }

            // One coloured soft sprite for the whole field (rain uses line streaks).
            var color = (type === 'embers')  ? '255,150,60'
                      : (type === 'sparkle') ? '255,240,180'
                      : (type === 'dust')    ? '235,235,240'
                      :                        '255,255,255';   // snow
            motion.sprite = makeSoftSprite(color);
            motion.spriteAdditive = (type === 'embers' || type === 'sparkle');
            motion.rainColor = '180,205,255';

            var density = (pc.density == null) ? 0.5 : pc.density;
            var count = Math.round(particleBaseCount(type) * density);
            tlog('info', 'motion particles: ' + type + ' x' + count + ' (density ' + density + ', size ' + (pc.size || 1) + ')');
            for (var i = 0; i < count; i++) motion.particles.push(spawnParticle(type, pc, w, h, true));
        }

        function updateAndDrawParticles(dt) {
            var ctx = motion.pctx;
            if (!ctx) return;
            var w = mpParticles.width, h = mpParticles.height;
            ctx.clearRect(0, 0, w, h);
            var ps = motion.particles;
            if (ps.length === 0) return;
            var pc = motion.recipe.particle || {};

            for (var i = 0; i < ps.length; i++) {
                var p = ps[i];
                p.x += p.vx * dt; p.y += p.vy * dt; p.life += dt;

                // Recycle when off-screen or past end-of-life.
                if (p.life >= p.maxLife || p.y < -40 || p.y > h + 40 || p.x < -40 || p.x > w + 40) {
                    ps[i] = spawnParticle(p.type, pc, w, h, false);
                    p = ps[i];
                }

                // Alpha envelope.
                var alpha;
                if (p.type === 'embers')       { alpha = (1 - p.life / p.maxLife) * 0.9; }
                else if (p.type === 'sparkle') { alpha = Math.sin((p.life / p.maxLife) * Math.PI); }
                else                           { alpha = p.baseAlpha; }
                if (alpha <= 0.01) continue;

                if (p.streak) {
                    // Rain: a short line along the velocity vector.
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.strokeStyle = 'rgba(' + motion.rainColor + ',' + alpha.toFixed(3) + ')';
                    ctx.lineWidth = Math.max(1, p.size * 0.14);
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p.x - p.vx * 45, p.y - p.vy * 45);
                    ctx.stroke();
                } else {
                    ctx.globalCompositeOperation = motion.spriteAdditive ? 'lighter' : 'source-over';
                    ctx.globalAlpha = alpha;
                    var d = p.size * 3;                    // sprite is soft → draw larger than nominal
                    ctx.drawImage(motion.sprite, p.x - d / 2, p.y - d / 2, d, d);
                }
            }
            ctx.globalAlpha = 1;
            ctx.globalCompositeOperation = 'source-over';
        }

        // The per-frame animation tick. Everything is derived from `phase`
        // (0..1 over loopMs) so the loop is seamless.
        function motionTick(ts) {
            if (!motion.active) return;
            if (motion.startTs === 0) { motion.startTs = ts; motion.lastTs = ts; motion.fpsWindowStart = ts; }
            var dt = Math.min(64, ts - motion.lastTs);      // clamp long gaps (throttling)
            motion.lastTs = ts;

            var r = motion.recipe;
            var phase = ((ts - motion.startTs) % motion.loopMs) / motion.loopMs;
            var theta = phase * 6.2831853;
            var sinT = Math.sin(theta);

            var cam = r.camera || {}, par = r.parallax || {};
            var zoomOsc = (cam.zoom || 0) * (1 - Math.cos(theta)) / 2;   // 0 → peak → 0 (loops)
            var panX = (cam.driftX || 0) * sinT * 100;                  // % of viewport
            var panY = (cam.driftY || 0) * sinT * 100;

            // Background Ken-Burns.
            mpBg.style.transform =
                'translate(' + panX.toFixed(3) + '%,' + panY.toFixed(3) + '%) scale(' + (1 + zoomOsc).toFixed(4) + ')';

            // Subject parallax: moves further than the background + gentle breathing.
            if (motion.subjectLoaded) {
                var f = 1 + (par.strength || 0);
                var breathe = 1 + (par.breathing || 0) * sinT;
                mpSubject.style.transform =
                    'translate(' + (panX * f).toFixed(3) + '%,' + (panY * f).toFixed(3) + '%) scale(' +
                    ((1 + zoomOsc) * breathe).toFixed(4) + ')';
            }

            // Light sweep: slide the diagonal band from off-screen to off-screen.
            if ((r.sweep || 0) > 0.01) {
                var pos = -120 + 340 * phase;
                mpSweep.style.transform = 'translateX(' + pos.toFixed(1) + '%)';
            }

            updateAndDrawParticles(dt);

            // FPS telemetry (1s window).
            motion.frames++; motion.fpsWindowFrames++;
            if (ts - motion.fpsWindowStart >= 1000) {
                motion.fps = Math.round(motion.fpsWindowFrames * 1000 / (ts - motion.fpsWindowStart));
                motion.fpsWindowStart = ts; motion.fpsWindowFrames = 0;
            }

            motion.raf = requestAnimationFrame(motionTick);
        }

        function motionHeartbeat() {
            if (!motion.active) return;
            broadcast('motionHeartbeat', {
                fps: motion.fps,
                particles: motion.particles.length,
                bgLoaded: motion.bgLoaded,
                subjectLoaded: motion.subjectLoaded,
                rot: currentRotation,                                   // isolate rotation vs fps
                fill: (motion.recipe && motion.recipe.fill) || '',
                bgW: mpBg.naturalWidth || 0, bgH: mpBg.naturalHeight || 0,   // decoded bg resolution
                heap: heapStats()
            });
        }

        // Build & start a motion poster from a recipe.
        function startMotion(recipe) {
            // Stop any PRIOR motion immediately (safe — its raf is cancelled
            // before we mutate the shared `motion` state below). But do NOT tear
            // down the current single-image / slideshow surface or reveal #motion
            // yet: hold whatever's on screen until the poster background has
            // DECODED, then go live + hide the others inside mpBg.onload. Doing it
            // eagerly here used to flash the motion container's black background
            // before the poster finished loading.
            clearMotion('restart');

            motion.recipe = recipe;
            motion.loopMs = Math.max(2000, (recipe.loopSeconds || 12) * 1000);
            motion.bgLoaded = false;
            motion.subjectLoaded = false;

            tlog('info', 'motion start: type=' + (recipe.particle && recipe.particle.type) +
                         ' fill=' + recipe.fill + ' loop=' + motion.loopMs + 'ms');

            // Whole container rotates like the other layers (portrait displays).
            styleRotation(motionEl, currentRotation);

            // Fill mode: portrait poster → soft fill behind + contain; else cover.
            // The fill canvas is painted in mpBg.onload (below) once the bg
            // image has decoded — see paintFill().
            if (recipe.fill === 'cover') {
                mpBg.style.objectFit = 'cover';
                mpFill.style.display = 'none';
            } else {
                mpBg.style.objectFit = 'contain';
                mpFill.style.display = 'block';
            }

            // Colour grade wash (warm amber / cool blue via soft-light).
            var warmth = (recipe.grade && recipe.grade.warmth) || 0;
            if (Math.abs(warmth) > 0.01) {
                mpGrade.style.background = 'rgba(' + (warmth > 0 ? '255,150,60' : '60,130,255') + ',1)';
                mpGrade.style.mixBlendMode = 'soft-light';
                mpGrade.style.opacity = Math.min(0.6, Math.abs(warmth) * 0.5);
            } else {
                mpGrade.style.opacity = 0;
            }

            // Vignette.
            mpVignette.style.opacity = (recipe.grade && recipe.grade.vignette) || 0;

            // Light-sweep band amount (moved each frame in motionTick).
            var sweepAmt = recipe.sweep || 0;
            if (sweepAmt > 0.01) {
                mpSweep.style.background =
                    'linear-gradient(115deg, rgba(255,250,235,0) 42%, rgba(255,250,235,' +
                    (0.5 * sweepAmt).toFixed(3) + ') 50%, rgba(255,250,235,0) 58%)';
                mpSweep.style.opacity = 1;
            } else {
                mpSweep.style.opacity = 0;
            }

            // Load images (plain <img>, no crossOrigin — the proven ingest).
            mpBg.onload  = function() {
                motion.bgLoaded = true;
                tlog('verbose', 'motion bg loaded ' + mpBg.naturalWidth + 'x' + mpBg.naturalHeight);
                if (recipe.fill !== 'cover') { paintFill(mpBg); }
                // Poster decoded — NOW reveal motion and tear down the other
                // surfaces (held until this moment so the prior image/slideshow
                // stayed visible instead of a black flash).
                clearSlideshow('motion');            // motion supersedes any slideshow
                clearVideo('motion');                // …and any playing video
                hideBridgeCover();
                splash.style.display = 'none';
                canvas.style.display = 'none';
                motionEl.classList.add('active');
                motion.active = true;
                motion.startTs = 0; motion.lastTs = 0;
                motion.frames = 0; motion.fpsWindowFrames = 0;
                if (!motion.raf)       motion.raf = requestAnimationFrame(motionTick);
                if (!motion.heartbeat) motion.heartbeat = setInterval(motionHeartbeat, 5000);
            };
            mpBg.onerror = function() { tlog('error', 'motion bg FAILED ' + recipe.bg); broadcast('motionError', { phase: 'bg', url: recipe.bg }); };
            mpBg.src = recipe.bg;

            if (recipe.subject) {
                mpSubject.style.display = 'block';
                mpSubject.onload  = function() { motion.subjectLoaded = true; tlog('verbose', 'motion subject loaded'); };
                mpSubject.onerror = function() { tlog('error', 'motion subject FAILED ' + recipe.subject); broadcast('motionError', { phase: 'subject', url: recipe.subject }); };
                mpSubject.src = recipe.subject;
            } else {
                mpSubject.style.display = 'none';
                mpSubject.src = '';
            }

            setupParticles(recipe.particle || {});

            // NB: motion goes live in mpBg.onload above — once the poster has
            // decoded — not here, so the previous surface holds until it's ready.
        }

        // ══ Video engine ═══════════════════════════════════════════════
        //
        // Plays a real H.264/HEVC <video> served over plain HTTP from the
        // phone. Uses the device's hardware VIDEO plane, which (a) can render
        // true 4K — the <img>/<canvas> graphics plane cannot — and (b) counts
        // as "playing video full screen", so TV screensavers stay away.
        //
        // Same last-wins contract as the other surfaces: hold whatever is on
        // screen until the new video can actually play, THEN switch, so there
        // is no black flash while it buffers. <video src> needs no canvas
        // pixel reads, so it sidesteps the CORS wall the image paths work around.

        var videoEl    = document.getElementById('video');       // rotated container
        var videoMedia = document.getElementById('video-el');    // the <video> element

        var video = { active: false, url: null, heartbeat: null, fullyBuffered: false,
                      preloading: false, preloadTimer: null, preloadStartAt: 0, resumeTimer: null,
                      bridged: false };

        // ── Poster-image bridge for still→video swaps ────────────────────
        // A gated single poster is delivered as a looping video (to defeat the TV
        // screensaver). Swapping the <video> src tears the old video down before
        // the new one can paint, which flashes black — and a canvas snapshot of a
        // hardware-plane <video> just draws black on these TVs, so that can't
        // bridge it. Instead the sender includes the poster as an `imageUrl`: we
        // show that poster FIRST via the gapless double-buffered <img> path, then
        // reveal the matching video on top only once it's actually painting (see
        // startVideo/reveal), hiding the image in the same turn — "show new, then
        // pull old." Only one video ever decodes at a time, so no dual-decoder risk.
        //
        // showPosterImage() is the shared <img> double-buffer used by BOTH the
        // plain `show` action and this bridge: load into the standby layer, then
        // swap it in atomically on decode so the previous surface never blanks.
        function showPosterImage(url, senderId, receivedAt, onShown) {
            standbyImg.onload = function() {
                clearSlideshow('single-image');
                clearMotion('single-image');
                clearVideo('single-image');
                hideBridgeCover();
                splash.style.display = 'none';
                canvas.style.display = 'block';
                activeImg.classList.remove('active');
                standbyImg.classList.add('active');
                var tmp = activeImg; activeImg = standbyImg; standbyImg = tmp;
                if (senderId) sendMessage(senderId, { event: 'imageDisplayed', url: url,
                                                      ts: Date.now(), processingMs: Date.now() - (receivedAt || Date.now()) });
                if (onShown) onShown();
            };
            standbyImg.onerror = function() {
                if (senderId) sendMessage(senderId, { event: 'error', message: 'Failed to load image', url: url,
                                                      ts: Date.now(), processingMs: Date.now() - (receivedAt || Date.now()) });
                if (onShown) onShown();   // proceed to the video even if the bridge image failed
            };
            standbyImg.src = url;
        }

        // ── Poster cover for still→video swaps (see #bridge) ─────────────
        var bridgeCover    = document.getElementById('bridge');
        var bridgeCoverImg = document.getElementById('bridge-img');

        // Raise the poster cover ON TOP of everything, then call onReady once the
        // poster has DECODED (so the cover paints a real image, not a blank box).
        function showBridgeCover(url, onReady) {
            bridgeCoverImg.onload = function() {
                styleRotation(bridgeCover, currentRotation);   // portrait upright, mirrors #canvas
                // Re-apply GPU promotion: styleRotation just overwrote `transform`
                // (to '' for landscape or 'rotate(..)' for portrait), which would
                // drop the cover back onto the non-composited layer — below the
                // hardware video plane. Keep translateZ(0) so it stacks above.
                bridgeCover.style.transform = (bridgeCover.style.transform
                    ? bridgeCover.style.transform + ' ' : '') + 'translateZ(0)';
                bridgeCover.classList.add('active');
                tlog('verbose', 'bridge cover up (transform=' + bridgeCover.style.transform + ')');
                if (onReady) onReady();
            };
            bridgeCoverImg.onerror = function() {
                tlog('error', 'bridge cover image failed: ' + url);
                if (onReady) onReady();   // start the video anyway rather than stall
            };
            bridgeCoverImg.src = url;
        }

        function hideBridgeCover() {
            if (bridgeCover.classList.contains('active')) {
                bridgeCover.classList.remove('active');
                tlog('verbose', 'bridge cover dropped');
            }
        }

        // Fire cb once the <video> has PRESENTED a real frame to the compositor —
        // the only safe moment to drop the cover. requestVideoFrameCallback is the
        // ground truth; fall back to timeupdate + a compositor tick where it's
        // unavailable. If the video never paints (wedge), cb never fires and the
        // cover stays up (poster held, never black) — exactly what we want.
        function onFirstVideoFrame(cb) {
            var fired = false;
            var go = function() { if (fired) return; fired = true; cb(); };
            if (typeof videoMedia.requestVideoFrameCallback === 'function') {
                videoMedia.requestVideoFrameCallback(function() { go(); });
            } else {
                var on = function() {
                    if ((videoMedia.currentTime || 0) <= 0) return;
                    videoMedia.removeEventListener('timeupdate', on);
                    requestAnimationFrame(function() { requestAnimationFrame(go); });
                };
                videoMedia.addEventListener('timeupdate', on);
            }
        }

        // How much of the clip the media element has cached from the start, and
        // whether the WHOLE file is buffered — the true "the receiver has the
        // entire show and no longer needs the phone" (safe-to-close) predicate.
        function bufferedInfo() {
            var dur = videoMedia.duration || 0;
            var tr  = videoMedia.buffered;
            var n   = (tr && tr.length) ? tr.length : 0;
            var bs  = n ? tr.start(0) : 0;                 // start of the FIRST range
            var be0 = n ? tr.end(0) : 0;                   // end of the FIRST (contiguous-from-start) range
            var be  = n ? tr.end(n - 1) : 0;               // end of the LAST range
            // Total contiguous seconds actually held (sum of all ranges) — the true
            // "retained" amount. If the file is fully cached this ≈ duration; if the
            // media engine is EVICTING, `bs` creeps up / `n` grows / held shrinks.
            var held = 0;
            for (var i = 0; i < n; i++) held += tr.end(i) - tr.start(i);
            var pct = dur > 0 ? Math.min(100, Math.round(be / dur * 100)) : 0;
            var heldPct = dur > 0 ? Math.min(100, Math.round(held / dur * 100)) : 0;
            // Compact ranges string for the log, e.g. "[0-120][300-1000]".
            var rangesStr = '';
            for (var j = 0; j < n && j < 6; j++) rangesStr += '[' + tr.start(j).toFixed(0) + '-' + tr.end(j).toFixed(0) + ']';
            if (n > 6) rangesStr += '…+' + (n - 6);
            // Contiguous-from-start coverage: the ONLY retention that guarantees a
            // seamless loop with no re-fetch. `be0 >= dur` (with bs≈0) means one solid
            // range [0..duration]. This — not `be` reaching the end — is safe-to-close.
            var contiguousPct = dur > 0 ? Math.min(100, Math.round(be0 / dur * 100)) : 0;
            return { dur: dur, be: be, be0: be0, bs: bs, pct: pct, ranges: n,
                     held: held, heldPct: heldPct, contiguousPct: contiguousPct, rangesStr: rangesStr };
        }

        // Fires the one-shot `videoBuffered` event once the entire clip is cached.
        // For a long clip the media element may only buffer a window ahead and
        // stream the rest — in which case this never fires, which is exactly the
        // signal the sender needs ("this TV did NOT fully cache — keep app open").
        function checkVideoBuffered() {
            if (!video.url || video.fullyBuffered) return;
            var b = bufferedInfo();
            // Require ONE contiguous range [0..duration] — not merely the end reached
            // (seek-ahead can leave mid-file holes, which fail on loop → re-fetch → crash).
            if (b.dur > 0 && b.bs <= 0.5 && b.be0 >= b.dur - 0.5) {
                video.fullyBuffered = true;
                broadcast('videoBuffered', { duration: +b.dur.toFixed(2), bufferedSec: +b.be0.toFixed(2), pct: 100 });
                tlog('info', 'video FULLY buffered contiguous (' + b.dur.toFixed(1) + 's) — safe to close sender');
            }
        }

        // Tear the video down and RELEASE the hardware decoder. Safe anytime.
        function clearVideo(reason) {
            if (!video.active && !video.url) return;
            if (video.heartbeat) { clearInterval(video.heartbeat); video.heartbeat = null; }
            if (video.preloadTimer) { clearInterval(video.preloadTimer); video.preloadTimer = null; }
            if (video.resumeTimer) { clearInterval(video.resumeTimer); video.resumeTimer = null; }
            video.preloading = false;
            videoMedia.oncanplay = null; videoMedia.onplaying = null; videoMedia.onerror = null;
            videoMedia.onprogress = null; videoMedia.onpause = null; videoMedia.onplay = null;
            videoMedia.onwaiting = null; videoMedia.onstalled = null; videoMedia.onended = null;
            video.fullyBuffered = false;
            // HIDE THE PLANE FIRST. `load()` (below) clears the <video> to opaque
            // black, and if the element is still on-screen that black paints for a
            // frame or two before it's hidden — the "take-down" flash. Removing the
            // `active` class first drops the video plane so whatever is behind (the
            // poster image / cover) shows immediately; the black reset then happens
            // on an already-hidden element. This is the fix for the teardown flash.
            video.active = false;
            videoEl.classList.remove('active');
            try { videoMedia.pause(); } catch (e) {}
            videoMedia.removeAttribute('src');
            try { videoMedia.load(); } catch (e) {}   // frees the decoder + buffered data
            // Release the in-RAM Blob. An object URL holds a STRONG reference to its
            // Blob, so without revoke the (up to ~45 MB) slideshow video stays resident
            // forever — every push routes through clearVideo(), so this frees the old
            // show whenever anything (image / new show / stop / clear / splash) replaces
            // it. Without it the receiver accumulated blobs until it degraded.
            if (video.url && video.url.indexOf('blob:') === 0) {
                try { URL.revokeObjectURL(video.url); } catch (e) {}
            }
            video.url = null;
            tlog('info', 'video cleared (' + (reason || '') + ')');
        }

        // Periodic health beat. videoWidth/videoHeight are the DECODED frame
        // dimensions — the ground-truth proof of 4K on the video plane (the
        // graphics-plane getInfo can only ever report ~1080p).
        function videoHeartbeat() {
            if (!video.active) return;
            checkVideoBuffered();
            var b = bufferedInfo();
            // Eviction truth: `heldPct` is how much is ACTUALLY resident (sum of all
            // ranges). If it drops below `bufferedPct` (end reached) — or `bufStart`
            // creeps above 0, or `ranges` > 1 — the engine is evicting cached data,
            // which means "fully buffered" was a lie and a loop/seek will re-fetch.
            broadcast('videoHeartbeat', {
                currentTime: +(videoMedia.currentTime || 0).toFixed(2),
                paused: videoMedia.paused,
                vw: videoMedia.videoWidth || 0,
                vh: videoMedia.videoHeight || 0,
                rot: currentRotation,
                bufferedPct: b.pct,
                heldPct: b.heldPct,
                bufStart: +b.bs.toFixed(1),
                ranges: b.ranges,
                rangesStr: b.rangesStr,
                heap: heapStats()
            });
        }

        // Keep a looping video self-healing: if it pauses itself (decode hiccup,
        // brief page-hide, standby blip) auto-resume; log waits/stalls. Shared by
        // the streaming reveal and the blob playback path.
        function attachVideoResilience() {
            videoMedia.onpause = function() {
                if (!video.active || video.preloading) return;
                var err = videoMedia.error;
                broadcast('videoEvent', { evt: 'pause', ct: +(videoMedia.currentTime || 0).toFixed(2),
                                          readyState: videoMedia.readyState, networkState: videoMedia.networkState,
                                          hidden: document.hidden, err: (err && err.code) || 0 });
                tlog('error', 'video PAUSED unexpectedly ct=' + (videoMedia.currentTime || 0).toFixed(2) +
                             ' readyState=' + videoMedia.readyState + ' netState=' + videoMedia.networkState +
                             ' hidden=' + document.hidden + ' err=' + ((err && err.code) || 0) + ' — auto-resuming');
                if (!video.resumeTimer) {
                    video.resumeTimer = setInterval(function() {
                        if (!video.active || !videoMedia.paused) { clearInterval(video.resumeTimer); video.resumeTimer = null; return; }
                        var p = videoMedia.play(); if (p && p.catch) p.catch(function() {});
                    }, 1000);
                }
            };
            videoMedia.onplay = function() {
                if (video.resumeTimer) { clearInterval(video.resumeTimer); video.resumeTimer = null;
                    tlog('info', 'video resumed ct=' + (videoMedia.currentTime || 0).toFixed(2)); }
            };
            videoMedia.onwaiting = function() {
                if (video.active && !video.preloading)
                    tlog('info', 'video WAITING ct=' + (videoMedia.currentTime || 0).toFixed(2) + ' readyState=' + videoMedia.readyState);
            };
            videoMedia.onstalled = function() {
                if (video.active && !video.preloading)
                    tlog('info', 'video STALLED ct=' + (videoMedia.currentTime || 0).toFixed(2) + ' netState=' + videoMedia.networkState);
            };
            videoMedia.onended = function() {
                if (video.active) { tlog('error', 'video ENDED (loop failed) — restarting'); try { videoMedia.currentTime = 0; videoMedia.play(); } catch (e) {} }
            };
        }

        // ── BLOB transfer: reassemble an MP4 streamed over the message channel ──
        // Each chunk (self-contained base64, sender uses a multiple-of-3 raw size) is
        // decoded to a Uint8Array AS IT ARRIVES and the base64 string freed, so we
        // never hold the giant joined-base64 string or a big atob() output — peak
        // memory ≈ the file itself, not ~3× it. The whole file lives in receiver RAM,
        // so playback SURVIVES the sender/app (and its HTTP server) going away.
        var blobXfer = null;   // { id, total, bytes, parts[](Uint8Array), received, fill, loop, startAt }

        // ── Blob transfer liveness heartbeat ──
        // `blobBeat` is a 1/s setInterval INDEPENDENT of chunk arrival — the sender's
        // hiccup detector. If beats keep arriving while `received` stays frozen and
        // `inMsgs == 0`, the device's inbound pipe has silently died (a fresh socket
        // clears it) and the sender reconnects + resumes. `inMsgs` = inbound custom
        // messages since the last beat (delta of `inboundMsgCount`). Kept deliberately
        // LEAN: the per-chunk decode-timing and heap fields were investigation-only and
        // have been removed to cut receiver CPU + channel chatter on weak devices.
        var inboundMsgCount = 0;   // every inbound custom message (delta'd per beat)
        var blobBeat        = null;
        var blobBeatTick    = 0;

        function startBlobBeat() {
            if (blobBeat) return;
            blobBeatTick = 0;
            var lastInbound = inboundMsgCount;
            var lastStallReceived = -1, stallTicks = 0;
            blobBeat = setInterval(function() {
                blobBeatTick++;
                var delta = inboundMsgCount - lastInbound;
                lastInbound = inboundMsgCount;
                broadcast('blobBeat', {
                    tick:     blobBeatTick,
                    received: blobXfer ? blobXfer.received : -1,
                    total:    blobXfer ? blobXfer.total : -1,
                    inMsgs:   delta
                });

                // Zombie/stall self-termination: if an incomplete transfer makes no
                // progress for ~10s the inbound pipe has died (poisoned socket) — stop
                // the beat, drop the partial buffer, and tell any sender. Without this
                // the interval runs forever and its stale beats mask the dead socket.
                if (blobXfer && blobXfer.received < blobXfer.total) {
                    if (blobXfer.received === lastStallReceived) {
                        if (++stallTicks >= 10) {
                            tlog('error', 'blob STALLED — no progress 10s at ' + blobXfer.received + '/' + blobXfer.total + ' — aborting');
                            broadcast('blobStalled', { received: blobXfer.received, total: blobXfer.total });
                            blobXfer = null;
                            stopBlobBeat();
                        }
                    } else {
                        stallTicks = 0; lastStallReceived = blobXfer.received;
                    }
                } else {
                    stallTicks = 0;
                }
            }, 1000);
        }
        function stopBlobBeat() {
            if (blobBeat) { clearInterval(blobBeat); blobBeat = null; }
        }

        function handleVideoBlobBegin(data) {
            // RESUME: the sender hiccupped and reconnected. If this id's partial transfer is
            // still here, KEEP the received parts and report our count so the sender continues
            // from there. If we lost it (id mismatch / zombie-terminated during a long
            // reconnect), start fresh and report received=0 so the sender restarts at 0 —
            // NEVER let the sender resume past chunks we don't hold.
            if (data.resume) {
                if (!(blobXfer && blobXfer.id === data.id)) {
                    blobXfer = { id: data.id, total: data.chunks || 0, bytes: data.bytes || 0,
                                 parts: new Array(data.chunks || 0), received: 0,
                                 fill: data.fill || 'cover', loop: data.loop !== false, startAt: Date.now() };
                }
                var have = 0;
                for (var r = 0; r < blobXfer.total; r++) { if (blobXfer.parts[r] !== undefined) have++; }
                blobXfer.received = have;
                tlog('info', 'blob RESUME id=' + data.id + ' — receiver holds ' + have + '/' + blobXfer.total);
                broadcast('blobResumed', { id: data.id, received: have, total: blobXfer.total });
                startBlobBeat();   // idempotent (guarded); restarts if the zombie timer stopped it
                return;
            }
            // Fresh transfer.
            blobXfer = { id: data.id, total: data.chunks || 0, bytes: data.bytes || 0,
                         parts: new Array(data.chunks || 0), received: 0,
                         fill: data.fill || 'cover', loop: data.loop !== false, startAt: Date.now() };
            tlog('info', 'blob begin id=' + data.id + ' chunks=' + data.chunks + ' bytes=' + data.bytes);
            startBlobBeat();
        }
        function handleVideoBlobChunk(data) {
            if (!blobXfer || blobXfer.id !== data.id) return;
            if (blobXfer.parts[data.i] === undefined) {
                // Decode straight to bytes — NO per-chunk timing instrumentation (it ran on
                // every one of ~45 chunks/s purely for the wedge investigation, now done).
                try {
                    var bin = atob(data.d);
                    var u = new Uint8Array(bin.length);
                    for (var k = 0; k < bin.length; k++) u[k] = bin.charCodeAt(k);
                    blobXfer.parts[data.i] = u;              // hold the DECODED bytes; base64 string is now free
                    blobXfer.received++;
                } catch (e) {
                    tlog('error', 'blob chunk decode failed i=' + data.i + ': ' + e);
                    // Surface it — a swallowed throw here is invisible once the app owns
                    // the log channel, and it looks identical to an event-loop freeze.
                    broadcast('fatal', { message: 'blob chunk decode failed i=' + data.i + ': ' + String(e), phase: 'blobChunk' });
                }
            }
            // Ack every 2 chunks so the sender's SMALL in-flight window (2–4 chunks of
            // 24 KB) keeps advancing — an every-8 ack would starve it into a deadlock.
            // No separate `videoBlobProgress` message: the sender derives the "Sending X%"
            // UI from its own acked count (halves receiver→sender chatter on weak devices).
            if (blobXfer.received % 2 === 0 || blobXfer.received === blobXfer.total) {
                broadcast('blobAck', { id: blobXfer.id, received: blobXfer.received });
            }
        }
        function handleVideoBlobEnd(data) {
            if (!blobXfer || blobXfer.id !== data.id) { tlog('error', 'blob end for unknown id ' + (data && data.id)); return; }
            stopBlobBeat();   // transfer is over (success or incomplete) — end the liveness ticker
            var missing = 0, len = 0;
            for (var k = 0; k < blobXfer.total; k++) {
                if (blobXfer.parts[k] === undefined) missing++; else len += blobXfer.parts[k].length;
            }
            if (missing > 0) {
                tlog('error', 'blob INCOMPLETE — missing ' + missing + '/' + blobXfer.total + ' chunks');
                broadcast('videoBlobError', { message: 'incomplete', missing: missing });
                blobXfer = null; return;
            }
            // Blob accepts the array of Uint8Array parts directly — no concatenation.
            var blob = new Blob(blobXfer.parts, { type: 'video/mp4' });
            var url = URL.createObjectURL(blob);
            var elapsed = (Date.now() - blobXfer.startAt) / 1000;
            tlog('info', 'blob COMPLETE ' + len + ' bytes in ' + elapsed.toFixed(1) + 's — playing from RAM (source-independent)');
            broadcast('videoBlobReady', { bytes: len, elapsedSec: +elapsed.toFixed(1) });
            playBlobVideo(url, blobXfer.fill, blobXfer.loop);
            blobXfer = null;
        }

        // Play a fully-in-memory blob: URL. No preload/seek-ahead needed — the bytes
        // are already resident, so we reveal + loop immediately with the same
        // self-healing resilience as the streaming path.
        function playBlobVideo(blobUrl, fill, loop) {
            clearVideo('blob-restart');
            video.url = blobUrl;
            video.fullyBuffered = true;
            video.preloading = false;
            videoMedia.loop = loop;
            videoMedia.muted = true;
            videoMedia.style.objectFit = (fill === 'cover') ? 'cover' : 'contain';
            styleRotation(videoEl, 0);
            videoMedia.oncanplay = function() {
                clearSlideshow('blob-video');
                clearMotion('blob-video');
                splash.style.display = 'none';
                canvas.style.display = 'none';
                videoEl.classList.add('active');
                hideBridgeCover();
                video.active = true;
                var p = videoMedia.play();
                if (p && p.catch) p.catch(function(err) { broadcast('videoError', { phase: 'play', message: String(err) }); });
                if (!video.heartbeat) video.heartbeat = setInterval(videoHeartbeat, 5000);
                attachVideoResilience();
                broadcast('videoPlaying', { url: 'blob', vw: videoMedia.videoWidth || 0, vh: videoMedia.videoHeight || 0, ts: Date.now() });
                tlog('info', 'blob video playing ' + (videoMedia.videoWidth || 0) + 'x' + (videoMedia.videoHeight || 0));
            };
            videoMedia.onerror = function() {
                var err = videoMedia.error;
                tlog('error', 'blob video error code=' + (err && err.code));
                broadcast('videoError', { phase: 'load', code: err && err.code, url: 'blob' });
            };
            videoMedia.src = blobUrl;
            try { videoMedia.load(); } catch (e) {}
        }

        // Build & start a video from { url, loop, fill }.
        //
        // FORCE-DOWNLOAD PRELOAD: the HTML5 <video> progressive loader throttles a
        // long clip to ~real-time, so a 15-min slideshow takes ~9 min to fully
        // cache — too slow for "close the app." We defeat that by playing the clip
        // HIDDEN + muted with the playhead pinned just behind the buffered edge
        // (seek-ahead), which makes the media engine pull the whole file at full
        // LAN speed. Only once the ENTIRE clip is cached do we reveal + loop it
        // (true safe-to-close). Rich per-tick logging reports the real download
        // rate so we can tell if Cast's Chrome honours the seek-ahead or re-throttles.
        function startVideo(data) {
            clearVideo('restart');   // stop any prior video; the poster-image bridge (if any) holds the screen until reveal

            video.url = data.url;
            video.fullyBuffered = false;
            video.preloading = true;
            video.preloadStartAt = Date.now();
            var loop = data.loop !== false;
            videoMedia.loop = false;                                  // no looping mid-preload (would reset buffer)
            videoMedia.muted = true;                                  // required for gesture-free autoplay
            videoMedia.style.objectFit = (data.fill === 'cover') ? 'cover' : 'contain';
            // The <video> is ALWAYS a landscape frame filling the Cast signal.
            // Hardware video decoders reject tall (portrait) frames, so for a
            // portrait mount the sender pre-rotates the pixels into a landscape
            // frame (same as the Samsung Frame path). We never rotate the element.
            styleRotation(videoEl, 0);

            // TESTING: very long so we always see the true buffering curve to 100%
            // instead of bailing to streaming early. Tighten for production.
            var PRELOAD_TIMEOUT_MS = 1800000;   // 30 min
            var lastPct = -1, lastBe = 0, lastBeAt = Date.now();

            function reveal(reason) {
                if (!video.preloading) return;
                video.preloading = false;
                if (video.preloadTimer) { clearInterval(video.preloadTimer); video.preloadTimer = null; }
                videoMedia.loop = loop;
                try { videoMedia.currentTime = 0; } catch (e) {}
                if (!video.heartbeat) video.heartbeat = setInterval(videoHeartbeat, 5000);
                attachVideoResilience();

                // Make the video live NOW. Tear down the other graphics surfaces
                // (slideshow/motion/splash/canvas image) — but when a poster COVER
                // is up (gated still→video), it sits ON TOP (z-index 11) and hides
                // the <video>'s display→paint warmup, so none of this shows. We then
                // drop the cover only once the video has PRESENTED a real frame
                // ("show new, then pull old"). Revealing the video by removing the
                // cover — never by stacking a not-yet-painted (black) <video> on top
                // of the poster — is what finally kills the black flash. If the
                // video never paints (wedge), the cover stays up: poster held, never
                // black. Without a cover (test/motion clips) reveal directly.
                clearSlideshow('video');
                clearMotion('video');
                videoEl.classList.add('active');
                splash.style.display = 'none';
                canvas.style.display = 'none';
                video.active = true;

                var p = videoMedia.play();
                if (p && p.catch) p.catch(function(err) {
                    tlog('error', 'video play() rejected: ' + err);
                    broadcast('videoError', { phase: 'play', message: String(err), url: video.url });
                });

                var announce = function () {
                    broadcast('videoPlaying', { url: video.url, vw: videoMedia.videoWidth || 0,
                                                vh: videoMedia.videoHeight || 0, ts: Date.now() });
                    tlog('info', 'video revealed (' + reason + ') at ' + bufferedInfo().pct + '% buffered');
                };
                if (video.bridged && bridgeCover.classList.contains('active')) {
                    onFirstVideoFrame(function () { hideBridgeCover(); announce(); });
                } else {
                    announce();
                }
            }

            function preloadTick() {
                if (!video.preloading) return;
                var b = bufferedInfo();
                var now = Date.now();
                var elapsed = (now - video.preloadStartAt) / 1000;

                // Progress is measured on the CONTIGUOUS-from-start edge (be0), the
                // only bytes that count for a seamless loop. `be`/ranges are logged too
                // so we can still see any holes.
                if (b.contiguousPct !== lastPct) {
                    var rate = (b.be0 - lastBe) / (((now - lastBeAt) / 1000) || 1);   // contiguous-sec cached per wall-sec
