<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; }
        body {
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #splash {
            position: absolute;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        #splash svg {
            width: 200px;
            height: 200px;
            opacity: 0.6;
        }
        #splash .label {
            position: absolute;
            bottom: 15%;
            color: #555;
            font-family: -apple-system, Helvetica Neue, Arial, sans-serif;
            font-size: 24px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        #canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            display: none;
        }

        .layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            visibility: hidden;
        }
        .layer.active {
            visibility: visible;
        }

        /* ── Motion poster layers (Cast-side animation) ──────────────────
           A looping "motion poster" rendered entirely on the receiver from a
           recipe + two plain <img> layers + a self-drawn <canvas> particle
           layer. Deliberately NO WebGL / no canvas reads of the poster pixels
           (cross-origin/CORS loads don't work over the plain-HTTP ingest the
           Cast runtime allows — see the slideshow note in the script). */
        #motion {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: none; overflow: hidden; background: #000;
            z-index: 6;
            /* Promote the whole rotated container to its own GPU layer. In
               portrait (90° rotation) the container's transform is otherwise
               re-rasterized with the whole animating subtree every frame,
               which roughly halved fps vs landscape. As a promoted layer the
               rotation is a one-time compositor transform. */
            will-change: transform;
            backface-visibility: hidden;
        }
        #motion.active { display: block; }
        #mp-fill, #mp-bg, #mp-subject {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            will-change: transform;   /* GPU-composite the camera/parallax transforms */
        }
        /* Blurred, zoomed copy behind a portrait poster on a landscape TV.
           A <canvas> painted with a tiny (≈64px) cover-cropped copy of the bg,
           then upscaled to fill: the upscale IS the blur, so we avoid a
           full-screen per-frame CSS blur() (the expensive part). brightness
           is cheap and kept. */
        #mp-fill    { transform: scale(1.25); filter: brightness(0.55); image-rendering: auto; }
        #mp-bg      { object-fit: contain; }
        #mp-subject { object-fit: contain; }
        #mp-particles { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        /* Additive diagonal light sweep. */
        #mp-sweep   { position: absolute; top: 0; left: 0; width: 100%; height: 100%;
                      mix-blend-mode: screen; pointer-events: none; opacity: 0; will-change: transform; }
        /* Warmth/colour grade wash. */
        #mp-grade   { position: absolute; top: 0; left: 0; width: 100%; height: 100%;
                      pointer-events: none; opacity: 0; }
        /* Vignette darkening at the edges. */
        #mp-vignette{ position: absolute; top: 0; left: 0; width: 100%; height: 100%;
                      pointer-events: none; opacity: 0;
                      background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.92) 130%); }
    </style>
</head>
<body>
    <!-- Splash screen shown until first image arrives -->
    <div id="splash">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="5" width="80" height="90" rx="4" stroke="#555" stroke-width="2"/>
            <rect x="16" y="11" width="68" height="72" rx="2" stroke="#444" stroke-width="1"/>
            <circle cx="50" cy="47" r="12" stroke="#555" stroke-width="1.5"/>
            <path d="M50 35 L50 59 M38 47 L62 47" stroke="#555" stroke-width="1"/>
        </svg>
        <div class="label">PosterCue</div>
    </div>

    <!-- Image display layers -->
    <div id="canvas">
        <img id="img1" class="layer active">
        <img id="img2" class="layer">
    </div>

    <!-- Motion poster layers (see #motion CSS + the Motion Poster engine).
         Back-to-front: blurred fill, background poster, subject cutout,
         particle canvas, light sweep, colour grade, vignette. -->
    <div id="motion">
        <canvas id="mp-fill"></canvas>
        <img    id="mp-bg">
        <img    id="mp-subject">
        <canvas id="mp-particles"></canvas>
        <div    id="mp-sweep"></div>
        <div    id="mp-grade"></div>
        <div    id="mp-vignette"></div>
    </div>

    <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <script>
        var context = cast.framework.CastReceiverContext.getInstance();
        var NAMESPACE = 'urn:x-cast:com.postercue';

        var splash = document.getElementById('splash');
        var canvas = document.getElementById('canvas');
        var activeImg = document.getElementById('img1');
        var standbyImg = document.getElementById('img2');
        var currentRotation = 0;

        // Restore the last orientation this device used, applied on load BEFORE
        // first paint. The Cast viewport is always landscape, so without this the
        // splash paints sideways on a portrait display until the app's
        // setOrientation message arrives over the network (~hundreds of ms) — a
        // visible flash. A portrait display that ran at 90° last time now paints
        // the placeholder upright instantly. (applyRotation is a hoisted function
        // declaration, so calling it here — before its textual definition — is fine.)
        try {
            var savedRotation = parseInt(localStorage.getItem('pc_rotation') || '0', 10);
            if (!isNaN(savedRotation) && savedRotation !== 0) {
                applyRotation(savedRotation);
            }
        } catch (e) {}

        // ── Receiver Visibility Tracking ─────────────────────────────
        //
        // The receiver detects when it's hidden (Home button, HDMI input
        // switch, TV standby) and signals the iOS sender via the custom
        // channel. The sender uses this to decide whether to disconnect
        // and reconnect (triggering CEC foreground launch) on the next
        // image push, instead of pushing into a hidden receiver.
        //
        // Three independent detection sources:
        //   1. Page Visibility API  — Home button, launcher overlay
        //   2. VISIBILITY_CHANGED   — HDMI input switch, TV power
        //   3. STANDBY_CHANGED      — TV standby enter/exit
        //
        // Deduplication: only sends when receiverVisible actually
        // changes, since multiple sources may fire simultaneously
        // (e.g. standby triggers both STANDBY_CHANGED and
        // document.visibilitychange on some devices).

        var receiverVisible = true;

        function broadcastVisibility(isVisible, reason) {
            if (isVisible === receiverVisible) return;
            receiverVisible = isVisible;
            var msg = {
                event: 'visibilityChanged',
                isVisible: isVisible,
                reason: reason,
                ts: Date.now()
            };
            var senders = context.getSenders();
            for (var i = 0; i < senders.length; i++) {
                context.sendCustomMessage(NAMESPACE, senders[i].id, msg);
            }
            console.log('PosterCue visibility: ' + (isVisible ? 'VISIBLE' : 'HIDDEN') + ' reason=' + reason);
        }

        // Source 1: Page Visibility API — detects Home button press,
        // launcher overlay, and any other Android activity foregrounding
        // over the Cast receiver. This is the primary signal for the
        // "Home button hides receiver" scenario.
        document.addEventListener('visibilitychange', function() {
            broadcastVisibility(!document.hidden,
                document.hidden ? 'documentHidden' : 'documentVisible');
        });

        // Source 2: Cast SDK VISIBILITY_CHANGED — fires when the HDMI
        // input changes (user switches TV input away from Cast device)
        // or the TV powers off. Distinct from Page Visibility API which
        // tracks the Android app lifecycle, not the HDMI signal.
        context.addEventListener(
            cast.framework.system.EventType.VISIBILITY_CHANGED,
            function(event) {
                broadcastVisibility(event.isVisible,
                    event.isVisible ? 'hdmiInputActive' : 'hdmiInputChanged');
            }
        );

        // Source 3: Cast SDK STANDBY_CHANGED — fires when the TV enters
        // or exits standby mode (screen on/off). Complements the sender-
        // side GCKCastDeviceStatusListener standbyStatus callback.
        context.addEventListener(
            cast.framework.system.EventType.STANDBY_CHANGED,
            function(event) {
                broadcastVisibility(!event.isStandby,
                    event.isStandby ? 'standby' : 'standbyExit');
            }
        );

        // Apply an orientation transform to a single element. Shared by the
        // image canvas AND the idle splash so the PosterCue placeholder is
        // upright on portrait displays — not just the photos.
        function styleRotation(el, deg) {
            var transform = '';
            if (deg === 90) {
                transform = 'rotate(90deg) translateY(-100%)';
                el.style.transformOrigin = 'top left';
                el.style.width = '100vh';
                el.style.height = '100vw';
            } else if (deg === 270) {
                transform = 'rotate(270deg) translateX(-100%)';
                el.style.transformOrigin = 'top left';
                el.style.width = '100vh';
                el.style.height = '100vw';
            } else if (deg === 180) {
                transform = 'rotate(180deg)';
                el.style.transformOrigin = 'center center';
                el.style.width = '100vw';
                el.style.height = '100vh';
            } else {
                transform = '';
                el.style.transformOrigin = 'center center';
                el.style.width = '100vw';
                el.style.height = '100vh';
            }
            el.style.transform = transform;
        }

        function applyRotation(deg) {
            currentRotation = deg;
            styleRotation(canvas, deg);
            styleRotation(splash, deg);
        }

        // Return the display to the branded idle placeholder (portrait-aware).
        // Used when a slideshow is stopped or the display is cleared, instead of
        // leaving the screen black.
        function showSplash() {
            // The splash is the idle "nothing is showing" state, so make it a
            // clean slate: tear down any motion poster (which sits above the
            // canvas at z-index 6) and any running slideshow. Both are safe /
            // idempotent no-ops when inactive. Without the clearMotion, stopping
            // a slideshow (or clearing) could leave a motion poster superimposed
            // over the placeholder.
            clearMotion('splash');
            clearSlideshow('splash');
            styleRotation(splash, currentRotation);
            splash.style.display = 'flex';
            canvas.style.display = 'none';
        }

        function sendMessage(senderId, payload) {
            context.sendCustomMessage(NAMESPACE, senderId, payload);
        }

        // ── CueTheShow: logging, telemetry & memory diagnostics ──────────
        //
        // The slideshow runs autonomously on the receiver after the iOS app
        // closes, so the receiver is our only eyes on what's happening. These
        // helpers give us (a) a leveled on-device log (visible via chrome://
        // inspect) and (b) telemetry pushed back to any still-connected sender
        // so it lands in PosterCue's Debug Logs during testing.

        var LOG_LEVELS = { error: 0, info: 1, verbose: 2 };
        var logLevel   = LOG_LEVELS.info;   // raised to verbose per-slideshow via msg.verbose
        var logRing    = [];                // last N lines, for on-device inspection
        var LOG_RING_MAX = 200;

        function tlog(level, msg) {
            if (LOG_LEVELS[level] > logLevel) return;
            var line = '[' + level + '] ' + msg;
            logRing.push(line);
            if (logRing.length > LOG_RING_MAX) logRing.shift();
            console.log('PosterCue ' + line);
        }

        // Chromium-only heap figures. IMPORTANT: this is the JS heap, NOT the
        // decoded-image / GPU memory where the slideshow frames actually live —
        // so treat it as a trend signal, not ground truth. The authoritative
        // OOM evidence is the sender-side silence watchdog (heartbeats stop).
        function heapStats() {
            try {
                var m = window.performance && window.performance.memory;
                if (!m) return null;
                return {
                    used:  m.usedJSHeapSize,
                    total: m.totalJSHeapSize,
                    limit: m.jsHeapSizeLimit,
                    pct:   m.jsHeapSizeLimit ? Math.round(m.usedJSHeapSize / m.jsHeapSizeLimit * 100) : null
                };
            } catch (e) { return null; }
        }

        // Broadcast a telemetry event to every connected sender (the triggering
        // sender may have closed, so we don't target a single id).
        function broadcast(event, extra) {
            var msg = { event: event, ts: Date.now() };
            if (extra) { for (var k in extra) { msg[k] = extra[k]; } }
            var senders = context.getSenders();
            for (var i = 0; i < senders.length; i++) {
                try { context.sendCustomMessage(NAMESPACE, senders[i].id, msg); } catch (e) {}
            }
        }

        // Best-effort crash reporting: a real OOM kills the page before it can
        // speak, but JS-level errors fire these first — ship a 'fatal' out
        // synchronously so the sender at least learns what happened.
        window.addEventListener('error', function(e) {
            tlog('error', 'window.onerror: ' + (e && e.message));
            broadcast('fatal', { message: String(e && e.message), source: e && e.filename, line: e && e.lineno });
        });
        window.addEventListener('unhandledrejection', function(e) {
            var reason = (e && e.reason) ? (e.reason.message || String(e.reason)) : 'unknown';
            tlog('error', 'unhandledrejection: ' + reason);
            broadcast('fatal', { message: 'unhandledrejection: ' + reason });
        });

        // ── CueTheShow slideshow engine ──────────────────────────────────
        //
        // Strategy (proven primitive only): preload every image into its own
        // plain <img> layer inside #canvas — no crossOrigin, no fetch, no
        // canvas pixel reads — which is the only ingest the Cast runtime allows
        // over plain HTTP. Once loaded, the decoded frames live in the DOM and
        // survive the iOS app / LocalHTTPServer going away, so the receiver can
        // cycle them on its own timer indefinitely. The cost is memory: N
        // decoded frames held at once — which is exactly what the heap/heartbeat
        // telemetry above lets us watch as we ramp the image count up.

        var slideshow = {
            active: false,
            paused: false,
            mode: 'sequential',
            durationMs: 30000,
            loop: true,
            images: [],         // [{ id, url, el, loaded }]
            index: -1,
            loopCount: 0,
            timer: null,
            heartbeat: null,
            startedAt: 0,
            lastShownId: null,
            lastMemWarnAt: 0
        };

        // Tear the slideshow down and free every decoded frame.
        function clearSlideshow(reason) {
            if (slideshow.timer)     { clearInterval(slideshow.timer);     slideshow.timer = null; }
            if (slideshow.heartbeat) { clearInterval(slideshow.heartbeat); slideshow.heartbeat = null; }
            for (var i = 0; i < slideshow.images.length; i++) {
                var el = slideshow.images[i].el;
                if (el) {
                    el.onload = null; el.onerror = null; el.src = '';
                    if (el.parentNode) el.parentNode.removeChild(el);
                }
            }
            var hadImages = slideshow.images.length;
            slideshow.active = false;
            slideshow.paused = false;
            slideshow.images = [];
            slideshow.index = -1;
            slideshow.loopCount = 0;
            slideshow.lastShownId = null;
            if (hadImages) tlog('info', 'slideshow cleared (' + reason + '), freed ' + hadImages + ' layers');
        }

        function checkMemory() {
            var heap = heapStats();
            if (!heap || heap.pct === null) return;
            if (heap.pct >= 80 && (Date.now() - slideshow.lastMemWarnAt) > 15000) {
                slideshow.lastMemWarnAt = Date.now();
                tlog('error', 'MEMORY WARNING heap ' + heap.pct + '%');
                broadcast('memoryWarning', { heap: heap, usagePct: heap.pct });
            }
        }

        function sendHeartbeat() {
            if (!slideshow.active) return;
            broadcast('slideshowHeartbeat', {
                index:    slideshow.index,
                total:    slideshow.images.length,
                mode:     slideshow.mode,
                loops:    slideshow.loopCount,
                paused:   slideshow.paused,
                uptimeMs: Date.now() - slideshow.startedAt,
                heap:     heapStats()
            });
        }

        // Show the next frame. Instant cut (hard swap) — no crossfade.
        function advanceSlideshow() {
            if (!slideshow.active || slideshow.paused) return;
            var loaded = slideshow.images.filter(function(it) { return it.loaded && it.el; });
            if (loaded.length === 0) return;

            var next;
            if (slideshow.mode === 'shuffle') {
                if (loaded.length === 1) {
                    next = loaded[0];
                } else {
                    do { next = loaded[Math.floor(Math.random() * loaded.length)]; }
                    while (next.id === slideshow.lastShownId);   // avoid back-to-back repeat
                }
            } else {
                var prev = slideshow.index;
                slideshow.index = (slideshow.index + 1) % loaded.length;
                if (slideshow.index === 0 && prev >= 0) slideshow.loopCount++;
                next = loaded[slideshow.index];
            }

            for (var i = 0; i < slideshow.images.length; i++) {
                if (slideshow.images[i].el) slideshow.images[i].el.classList.remove('active');
            }
            next.el.classList.add('active');
            slideshow.lastShownId = next.id;

            if (logLevel >= LOG_LEVELS.verbose) {
                broadcast('slideshowAdvanced', { index: slideshow.index, id: next.id, heap: heapStats() });
            }
            checkMemory();
        }

        function startSlideshow(data) {
            clearSlideshow('restart');               // tear down any prior show first
            clearMotion('slideshow');                // and any running motion poster

            // Hide the single-image layers; the slideshow uses its own layers
            // inside the same #canvas, so it inherits orientation/rotation.
            activeImg.classList.remove('active');
            standbyImg.classList.remove('active');
            splash.style.display = 'none';
            canvas.style.display = 'block';

            logLevel            = data.verbose ? LOG_LEVELS.verbose : LOG_LEVELS.info;
            slideshow.mode      = (data.mode === 'shuffle') ? 'shuffle' : 'sequential';
            slideshow.durationMs = Math.max(2000, data.durationMs || 30000);
            slideshow.loop      = data.loop !== false;
            slideshow.startedAt = Date.now();
            slideshow.active    = true;
            slideshow.paused    = false;

            var list  = data.images || [];
            var total = list.length;
            tlog('info', 'slideshow start: ' + total + ' images, mode=' + slideshow.mode +
                         ', duration=' + slideshow.durationMs + 'ms, verbose=' + (logLevel === LOG_LEVELS.verbose));

            if (total === 0) {
                broadcast('slideshowError', { phase: 'preload', message: 'empty image list' });
                clearSlideshow('empty');
                return;
            }

            var loaded = 0, failed = 0, settled = 0;

            function onSettled() {
                settled++;
                if (settled < total) return;
                var heap = heapStats();
                tlog('info', 'slideshow ready: ' + loaded + ' loaded, ' + failed + ' failed' +
                             (heap ? ', heap ' + heap.pct + '%' : ''));
                broadcast('slideshowReady', { total: total, loaded: loaded, failed: failed, heap: heap });
                checkMemory();
                if (loaded === 0) {
                    broadcast('slideshowError', { phase: 'preload', message: 'no images loaded' });
                    clearSlideshow('all-failed');
                    return;
                }
                // Kick off the autonomous loop — from here the sender can close.
                slideshow.index = -1;
                advanceSlideshow();
                slideshow.timer     = setInterval(advanceSlideshow, slideshow.durationMs);
                slideshow.heartbeat = setInterval(sendHeartbeat, 30000);  // throttled health beat
            }

            for (var i = 0; i < total; i++) {
                (function(item, idx) {
                    var el = document.createElement('img');
                    el.className = 'layer';
                    el.onload = function() {
                        item.loaded = true; loaded++;
                        tlog('verbose', 'preloaded [' + (idx + 1) + '/' + total + '] ' + item.id);
                        broadcast('slideshowLoading', { loaded: loaded, total: total, id: item.id });
                        onSettled();
                    };
                    el.onerror = function() {
                        item.loaded = false; failed++;
                        tlog('error', 'preload FAILED [' + (idx + 1) + '/' + total + '] ' + item.id + ' ' + item.url);
                        broadcast('imageLoadError', { url: item.url, index: idx, id: item.id });
                        onSettled();
                    };
                    item.el = el;
                    canvas.appendChild(el);
                    el.src = item.url;       // plain HTTP <img> load — the proven primitive
                })(list[i], i);
            }
            slideshow.images = list;
        }

        function slideshowControl(op) {
            if (op === 'pause')  { slideshow.paused = true;  tlog('info', 'slideshow paused');  broadcast('slideshowPaused',  {}); }
            else if (op === 'resume') { slideshow.paused = false; tlog('info', 'slideshow resumed'); broadcast('slideshowResumed', {}); }
            else if (op === 'stop')   { clearSlideshow('stop-command'); showSplash(); broadcast('slideshowStopped', {}); }
        }

        // ══ Motion Poster engine ═════════════════════════════════════════
        //
        // Renders a looping "motion poster" on the receiver from a compact
        // recipe (see the iOS MotionRecipe contract) plus two plain <img>
        // layers (background + lifted subject PNG) and a self-drawn <canvas>
        // particle layer.
        //
        // Design constraints (why it looks the way it does):
        //   • Plain <img> ingest ONLY. Poster images arrive over plain HTTP
        //     from the phone; cross-origin/CORS/canvas-reads of them do not
        //     work on the Cast runtime (same finding as the slideshow above).
        //     So we never sample the poster's pixels — the canvas only draws
        //     OUR OWN generated particle sprites, which never taint anything.
        //   • Effects that would need to read poster pixels (heat shimmer,
        //     energy-flow, depth displacement) are NOT rendered here. What we
        //     do render: Ken-Burns camera, subject parallax, particles, colour
        //     grade, vignette, and a diagonal light sweep.
        //   • All motion is a pure function of a loop phase (0..1), so it loops
        //     seamlessly regardless of frame rate.
        //   • ES5 only (var/function, no template literals) for older sticks.

        var motionEl    = document.getElementById('motion');
        var mpFill      = document.getElementById('mp-fill');
        var mpBg        = document.getElementById('mp-bg');
        var mpSubject   = document.getElementById('mp-subject');
        var mpParticles = document.getElementById('mp-particles');
        var mpSweep     = document.getElementById('mp-sweep');
        var mpGrade     = document.getElementById('mp-grade');
        var mpVignette  = document.getElementById('mp-vignette');

        var motion = {
            active: false,
            raf: 0,
            startTs: 0,
            lastTs: 0,
            loopMs: 12000,
            recipe: null,
            particles: [],
            pctx: null,          // 2D context of the particle canvas
            sprite: null,        // pre-rendered soft dot (fast drawImage, no per-particle gradients)
            spriteAdditive: false,
            // debug / telemetry
            frames: 0,
            fpsWindowStart: 0,
            fpsWindowFrames: 0,
            fps: 0,
            heartbeat: null,
            bgLoaded: false,
            subjectLoaded: false
        };

        function rand(a, b) { return a + Math.random() * (b - a); }

        // Paint the blurred-fill layer: draw the bg cover-cropped into a tiny
        // (64×36) canvas backing, which CSS then upscales to fill the screen.
        // The heavy bilinear upscale reads as a soft blur for free — far
        // cheaper than a full-screen per-frame CSS blur(40px). Drawing a
        // cross-origin <img> taints the canvas, but we only ever DISPLAY it
        // (never read pixels), which is allowed. Static: painted once per push.
        function paintFill(img) {
            var W = 64, H = 36;   // 16:9 backing; the container is 1920×1080 pre-rotation
            var iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
            if (!iw || !ih || !mpFill.getContext) return;
            mpFill.width = W; mpFill.height = H;
            var fctx = mpFill.getContext('2d');
            var scale = Math.max(W / iw, H / ih);   // cover
            var dw = iw * scale, dh = ih * scale;
            fctx.clearRect(0, 0, W, H);
            fctx.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);
        }

        // Tear the motion poster down and free its layers. Safe to call anytime.
        function clearMotion(reason) {
            if (!motion.active && motion.raf === 0) return;
            if (motion.raf)       { cancelAnimationFrame(motion.raf); motion.raf = 0; }
            if (motion.heartbeat) { clearInterval(motion.heartbeat);  motion.heartbeat = null; }
            motion.active = false;
            motion.particles = [];
            mpBg.onload = null; mpBg.onerror = null; mpBg.src = '';
            mpSubject.onload = null; mpSubject.onerror = null; mpSubject.src = '';
            if (mpFill.getContext) { mpFill.getContext('2d').clearRect(0, 0, mpFill.width, mpFill.height); }
            motionEl.classList.remove('active');
            tlog('info', 'motion cleared (' + (reason || '') + ')');
        }

        // Nominal on-screen particle count per type (scaled by density).
        function particleBaseCount(type) {
            if (type === 'embers')  return 90;
            if (type === 'dust')    return 70;
            if (type === 'snow')    return 120;
            if (type === 'rain')    return 200;
            if (type === 'sparkle') return 110;
            return 0;
        }

        // Pre-render a soft radial dot once; drawImage'ing it per particle is far
        // cheaper than building a gradient every frame (matters on weak sticks).
        function makeSoftSprite(color) {
            var s = 64;
            var c = document.createElement('canvas'); c.width = s; c.height = s;
            var g = c.getContext('2d');
            var grad = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
            grad.addColorStop(0, 'rgba(' + color + ',1)');
            grad.addColorStop(1, 'rgba(' + color + ',0)');
            g.fillStyle = grad;
            g.fillRect(0, 0, s, s);
            return c;
        }

        // Choose an ember seed point. If the recipe has hot regions and placement
        // isn't 'fullFrame', seed near a random hot region (the "fire"); else seed
        // across the lower half (embers rise). hotRegions are y-DOWN normalized.
        function emberSeed(pc, w, h) {
            var regions = pc.hotRegions || [];
            var useRegions = (pc.placement !== 'fullFrame') && regions.length > 0 &&
                             (pc.hotStrength == null || pc.hotStrength >= 0.3);
            if (useRegions) {
                var r = regions[Math.floor(Math.random() * regions.length)];
                return { x: r.x * w + rand(-0.12, 0.12) * w, y: r.y * h + rand(-0.06, 0.06) * h };
            }
            return { x: rand(0, w), y: rand(0.5, 1.0) * h };
        }

        // Create one particle. dt-based velocities are in px per millisecond.
        function spawnParticle(type, pc, w, h, initial) {
            var sizeMult  = (pc.size == null)  ? 1   : pc.size;
            var speedMult = (pc.speed == null) ? 0.5 : pc.speed;
            var p = { type: type, additive: false, streak: false, baseAlpha: 0.5 };

            if (type === 'embers') {
                var s = emberSeed(pc, w, h);
                p.x = s.x; p.y = s.y;
                p.vx = rand(-8, 8) / 1000;
                p.vy = -(40 + 80 * speedMult) / 1000;         // upward
                p.size = rand(2, 5) * sizeMult;
                p.life = initial ? rand(0, 3000) : 0;
                p.maxLife = rand(2500, 5000);
                p.additive = true;
            } else if (type === 'dust') {
                p.x = rand(0, w); p.y = rand(0, h);
                var a = rand(0, Math.PI * 2), sp = (6 + 14 * speedMult) / 1000;
                p.vx = Math.cos(a) * sp; p.vy = Math.sin(a) * sp;
                p.size = rand(18, 52) * sizeMult;
                p.life = initial ? rand(0, 9000) : 0;
                p.maxLife = rand(8000, 12000);
                p.baseAlpha = 0.26;
            } else if (type === 'snow') {
                p.x = rand(0, w); p.y = initial ? rand(0, h) : rand(-0.1, 0) * h;
                p.vx = rand(-10, 20) / 1000; p.vy = (30 + 50 * speedMult) / 1000;
                p.size = rand(2, 5) * sizeMult;
                p.life = 0; p.maxLife = 9e9;                  // recycled by going off-screen
                p.baseAlpha = 0.85;
            } else if (type === 'rain') {
                p.x = rand(0, w); p.y = initial ? rand(0, h) : rand(-0.1, 0) * h;
                p.vx = 40 / 1000; p.vy = (700 + 500 * speedMult) / 1000;
                p.size = rand(8, 16) * sizeMult;
                p.life = 0; p.maxLife = 9e9;
                p.baseAlpha = 0.35; p.streak = true;
            } else if (type === 'sparkle') {
                p.x = rand(0, w); p.y = rand(0, h);
                p.vx = rand(-5, 5) / 1000; p.vy = rand(-5, 5) / 1000;
                p.size = rand(1.5, 4) * sizeMult;
                p.life = initial ? rand(0, 1600) : 0;
                p.maxLife = rand(1200, 2000);
                p.additive = true;
            }
            return p;
        }

        // Size the particle canvas to the viewport and seed the field.
        // DPR is pinned to 1 (1920x1080) to keep cheap sticks smooth.
        function setupParticles(pc) {
            var w = Math.round(window.innerWidth);
            var h = Math.round(window.innerHeight);
            mpParticles.width = w;
            mpParticles.height = h;
            motion.pctx = mpParticles.getContext('2d');
            motion.particles = [];

            var type = pc.type || 'none';
            if (type === 'none') { motion.sprite = null; tlog('info', 'motion particles: none'); return; }

            // One coloured soft sprite for the whole field (rain uses line streaks).
            var color = (type === 'embers')  ? '255,150,60'
                      : (type === 'sparkle') ? '255,240,180'
                      : (type === 'dust')    ? '235,235,240'
                      :                        '255,255,255';   // snow
            motion.sprite = makeSoftSprite(color);
            motion.spriteAdditive = (type === 'embers' || type === 'sparkle');
            motion.rainColor = '180,205,255';

            var density = (pc.density == null) ? 0.5 : pc.density;
            var count = Math.round(particleBaseCount(type) * density);
            tlog('info', 'motion particles: ' + type + ' x' + count + ' (density ' + density + ', size ' + (pc.size || 1) + ')');
            for (var i = 0; i < count; i++) motion.particles.push(spawnParticle(type, pc, w, h, true));
        }

        function updateAndDrawParticles(dt) {
            var ctx = motion.pctx;
            if (!ctx) return;
            var w = mpParticles.width, h = mpParticles.height;
            ctx.clearRect(0, 0, w, h);
            var ps = motion.particles;
            if (ps.length === 0) return;
            var pc = motion.recipe.particle || {};

            for (var i = 0; i < ps.length; i++) {
                var p = ps[i];
                p.x += p.vx * dt; p.y += p.vy * dt; p.life += dt;

                // Recycle when off-screen or past end-of-life.
                if (p.life >= p.maxLife || p.y < -40 || p.y > h + 40 || p.x < -40 || p.x > w + 40) {
                    ps[i] = spawnParticle(p.type, pc, w, h, false);
                    p = ps[i];
                }

                // Alpha envelope.
                var alpha;
                if (p.type === 'embers')       { alpha = (1 - p.life / p.maxLife) * 0.9; }
                else if (p.type === 'sparkle') { alpha = Math.sin((p.life / p.maxLife) * Math.PI); }
                else                           { alpha = p.baseAlpha; }
                if (alpha <= 0.01) continue;

                if (p.streak) {
                    // Rain: a short line along the velocity vector.
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.strokeStyle = 'rgba(' + motion.rainColor + ',' + alpha.toFixed(3) + ')';
                    ctx.lineWidth = Math.max(1, p.size * 0.14);
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p.x - p.vx * 45, p.y - p.vy * 45);
                    ctx.stroke();
                } else {
                    ctx.globalCompositeOperation = motion.spriteAdditive ? 'lighter' : 'source-over';
                    ctx.globalAlpha = alpha;
                    var d = p.size * 3;                    // sprite is soft → draw larger than nominal
                    ctx.drawImage(motion.sprite, p.x - d / 2, p.y - d / 2, d, d);
                }
            }
            ctx.globalAlpha = 1;
            ctx.globalCompositeOperation = 'source-over';
        }

        // The per-frame animation tick. Everything is derived from `phase`
        // (0..1 over loopMs) so the loop is seamless.
        function motionTick(ts) {
            if (!motion.active) return;
            if (motion.startTs === 0) { motion.startTs = ts; motion.lastTs = ts; motion.fpsWindowStart = ts; }
            var dt = Math.min(64, ts - motion.lastTs);      // clamp long gaps (throttling)
            motion.lastTs = ts;

            var r = motion.recipe;
            var phase = ((ts - motion.startTs) % motion.loopMs) / motion.loopMs;
            var theta = phase * 6.2831853;
            var sinT = Math.sin(theta);

            var cam = r.camera || {}, par = r.parallax || {};
            var zoomOsc = (cam.zoom || 0) * (1 - Math.cos(theta)) / 2;   // 0 → peak → 0 (loops)
            var panX = (cam.driftX || 0) * sinT * 100;                  // % of viewport
            var panY = (cam.driftY || 0) * sinT * 100;

            // Background Ken-Burns.
            mpBg.style.transform =
                'translate(' + panX.toFixed(3) + '%,' + panY.toFixed(3) + '%) scale(' + (1 + zoomOsc).toFixed(4) + ')';

            // Subject parallax: moves further than the background + gentle breathing.
            if (motion.subjectLoaded) {
                var f = 1 + (par.strength || 0);
                var breathe = 1 + (par.breathing || 0) * sinT;
                mpSubject.style.transform =
                    'translate(' + (panX * f).toFixed(3) + '%,' + (panY * f).toFixed(3) + '%) scale(' +
                    ((1 + zoomOsc) * breathe).toFixed(4) + ')';
            }

            // Light sweep: slide the diagonal band from off-screen to off-screen.
            if ((r.sweep || 0) > 0.01) {
                var pos = -120 + 340 * phase;
                mpSweep.style.transform = 'translateX(' + pos.toFixed(1) + '%)';
            }

            updateAndDrawParticles(dt);

            // FPS telemetry (1s window).
            motion.frames++; motion.fpsWindowFrames++;
            if (ts - motion.fpsWindowStart >= 1000) {
                motion.fps = Math.round(motion.fpsWindowFrames * 1000 / (ts - motion.fpsWindowStart));
                motion.fpsWindowStart = ts; motion.fpsWindowFrames = 0;
            }

            motion.raf = requestAnimationFrame(motionTick);
        }

        function motionHeartbeat() {
            if (!motion.active) return;
            broadcast('motionHeartbeat', {
                fps: motion.fps,
                particles: motion.particles.length,
                bgLoaded: motion.bgLoaded,
                subjectLoaded: motion.subjectLoaded,
                rot: currentRotation,                                   // isolate rotation vs fps
                fill: (motion.recipe && motion.recipe.fill) || '',
                bgW: mpBg.naturalWidth || 0, bgH: mpBg.naturalHeight || 0,   // decoded bg resolution
                heap: heapStats()
            });
        }

        // Build & start a motion poster from a recipe.
        function startMotion(recipe) {
            // Stop any PRIOR motion immediately (safe — its raf is cancelled
            // before we mutate the shared `motion` state below). But do NOT tear
            // down the current single-image / slideshow surface or reveal #motion
            // yet: hold whatever's on screen until the poster background has
            // DECODED, then go live + hide the others inside mpBg.onload. Doing it
            // eagerly here used to flash the motion container's black background
            // before the poster finished loading.
            clearMotion('restart');

            motion.recipe = recipe;
            motion.loopMs = Math.max(2000, (recipe.loopSeconds || 12) * 1000);
            motion.bgLoaded = false;
            motion.subjectLoaded = false;

            tlog('info', 'motion start: type=' + (recipe.particle && recipe.particle.type) +
                         ' fill=' + recipe.fill + ' loop=' + motion.loopMs + 'ms');

            // Whole container rotates like the other layers (portrait displays).
            styleRotation(motionEl, currentRotation);

            // Fill mode: portrait poster → soft fill behind + contain; else cover.
            // The fill canvas is painted in mpBg.onload (below) once the bg
            // image has decoded — see paintFill().
            if (recipe.fill === 'cover') {
                mpBg.style.objectFit = 'cover';
                mpFill.style.display = 'none';
            } else {
                mpBg.style.objectFit = 'contain';
                mpFill.style.display = 'block';
            }

            // Colour grade wash (warm amber / cool blue via soft-light).
            var warmth = (recipe.grade && recipe.grade.warmth) || 0;
            if (Math.abs(warmth) > 0.01) {
                mpGrade.style.background = 'rgba(' + (warmth > 0 ? '255,150,60' : '60,130,255') + ',1)';
                mpGrade.style.mixBlendMode = 'soft-light';
                mpGrade.style.opacity = Math.min(0.6, Math.abs(warmth) * 0.5);
            } else {
                mpGrade.style.opacity = 0;
            }

            // Vignette.
            mpVignette.style.opacity = (recipe.grade && recipe.grade.vignette) || 0;

            // Light-sweep band amount (moved each frame in motionTick).
            var sweepAmt = recipe.sweep || 0;
            if (sweepAmt > 0.01) {
                mpSweep.style.background =
                    'linear-gradient(115deg, rgba(255,250,235,0) 42%, rgba(255,250,235,' +
                    (0.5 * sweepAmt).toFixed(3) + ') 50%, rgba(255,250,235,0) 58%)';
                mpSweep.style.opacity = 1;
            } else {
                mpSweep.style.opacity = 0;
            }

            // Load images (plain <img>, no crossOrigin — the proven ingest).
            mpBg.onload  = function() {
                motion.bgLoaded = true;
                tlog('verbose', 'motion bg loaded ' + mpBg.naturalWidth + 'x' + mpBg.naturalHeight);
                if (recipe.fill !== 'cover') { paintFill(mpBg); }
                // Poster decoded — NOW reveal motion and tear down the other
                // surfaces (held until this moment so the prior image/slideshow
                // stayed visible instead of a black flash).
                clearSlideshow('motion');            // motion supersedes any slideshow
                splash.style.display = 'none';
                canvas.style.display = 'none';
                motionEl.classList.add('active');
                motion.active = true;
                motion.startTs = 0; motion.lastTs = 0;
                motion.frames = 0; motion.fpsWindowFrames = 0;
                if (!motion.raf)       motion.raf = requestAnimationFrame(motionTick);
                if (!motion.heartbeat) motion.heartbeat = setInterval(motionHeartbeat, 5000);
            };
            mpBg.onerror = function() { tlog('error', 'motion bg FAILED ' + recipe.bg); broadcast('motionError', { phase: 'bg', url: recipe.bg }); };
            mpBg.src = recipe.bg;

            if (recipe.subject) {
                mpSubject.style.display = 'block';
                mpSubject.onload  = function() { motion.subjectLoaded = true; tlog('verbose', 'motion subject loaded'); };
                mpSubject.onerror = function() { tlog('error', 'motion subject FAILED ' + recipe.subject); broadcast('motionError', { phase: 'subject', url: recipe.subject }); };
                mpSubject.src = recipe.subject;
            } else {
                mpSubject.style.display = 'none';
                mpSubject.src = '';
            }

            setupParticles(recipe.particle || {});

            // NB: motion goes live in mpBg.onload above — once the poster has
            // decoded — not here, so the previous surface holds until it's ready.
        }

        context.addCustomMessageListener(NAMESPACE, function(event) {
            var receivedAt = Date.now();
            var data = event.data;
            if (typeof data === 'string') {
                data = JSON.parse(data);
            }

            if (data.action === 'show') {
                // A single image (album art, movie poster, auto-push) permanently
                // stops any running slideshow / motion poster and displays it.
                //
                // Switch surfaces ATOMICALLY once the new image has DECODED:
                // whatever is currently on screen — a motion poster, the prior
                // single image, or a slideshow — is held until then, and the
                // teardown + reveal + double-buffer swap all happen in one
                // synchronous turn inside onload. Revealing the canvas (or
                // clearing motion) BEFORE the new image loaded used to briefly
                // paint the stale previous frame. Image→image crossfade is
                // unchanged (the inactive-mode teardowns are no-ops there); on a
                // load failure the current surface simply stays up.
                standbyImg.onload = function() {
                    clearSlideshow('single-image');
                    clearMotion('single-image');
                    splash.style.display = 'none';
                    canvas.style.display = 'block';
                    activeImg.classList.remove('active');
                    standbyImg.classList.add('active');
                    var temp = activeImg;
                    activeImg = standbyImg;
                    standbyImg = temp;
                    sendMessage(event.senderId, {
                        event: 'imageDisplayed',
                        url: data.url,
                        ts: Date.now(),
                        processingMs: Date.now() - receivedAt
                    });
                };
                standbyImg.onerror = function() {
                    sendMessage(event.senderId, {
                        event: 'error',
                        message: 'Failed to load image',
                        url: data.url,
                        ts: Date.now(),
                        processingMs: Date.now() - receivedAt
                    });
                };
                standbyImg.src = data.url;
            }

            else if (data.action === 'motionPoster') {
                // Cast-side animated poster. See the Motion Poster engine above.
                startMotion(data);
                sendMessage(event.senderId, {
                    event: 'motionPosterStarted',
                    type: (data.particle && data.particle.type) || 'none',
                    fill: data.fill,
                    loopMs: motion.loopMs,
                    ts: Date.now(),
                    processingMs: Date.now() - receivedAt
                });
            }

            else if (data.action === 'setOrientation') {
                applyRotation(data.rotation || 0);
                // Keep a live motion poster upright too if orientation changes.
                if (motion.active) styleRotation(motionEl, data.rotation || 0);
                // Remember it for this device so the next cold start paints the
                // placeholder in the right orientation immediately (no flash).
                try { localStorage.setItem('pc_rotation', String(currentRotation)); } catch (e) {}
                sendMessage(event.senderId, {
                    event: 'orientationSet',
                    rotation: currentRotation,
                    ts: Date.now(),
                    processingMs: Date.now() - receivedAt
                });
            }

            else if (data.action === 'clear') {
                clearSlideshow('clear-command');
                clearMotion('clear-command');
                // Detach load/error handlers BEFORE clearing src —
                // setting src='' triggers onerror, which would fire
                // the stale handler from the last 'show' command and
                // send a spurious "Failed to load image" error.
                activeImg.onload = null;
                activeImg.onerror = null;
                standbyImg.onload = null;
                standbyImg.onerror = null;
                activeImg.classList.remove('active');
                standbyImg.classList.remove('active');
                activeImg.src = '';
                standbyImg.src = '';
                showSplash();   // portrait-aware idle placeholder (not a black screen)
                sendMessage(event.senderId, { event: 'cleared', ts: Date.now(), processingMs: Date.now() - receivedAt });
            }

            else if (data.action === 'testRotation') {
                // Diagnostic: cycle through all four rotation values (0, 90, 180, 270)
                // with the current image visible, pausing 5s on each. Overlays the
                // current rotation value so the user can identify which looks correct.
                var rotations = [0, 90, 180, 270];
                var overlay = document.createElement('div');
                overlay.style.cssText = 'position:fixed;top:20px;left:20px;z-index:999;' +
                    'color:#fff;font-size:48px;font-family:monospace;' +
                    'background:rgba(0,0,0,0.7);padding:12px 24px;border-radius:8px;';
                document.body.appendChild(overlay);
                var idx = 0;
                function nextRotation() {
                    if (idx >= rotations.length) {
                        document.body.removeChild(overlay);
                        // Restore original rotation
                        applyRotation(data.originalRotation || 0);
                        sendMessage(event.senderId, {
                            event: 'testRotationComplete',
                            tested: rotations,
                            ts: Date.now(),
                            processingMs: Date.now() - receivedAt
                        });
                        return;
                    }
                    var deg = rotations[idx];
                    overlay.textContent = 'CSS rotate(' + deg + 'deg)';
                    applyRotation(deg);
                    idx++;
                    setTimeout(nextRotation, 5000);
                }
                nextRotation();
            }

            else if (data.action === 'getVisibility') {
                // On-demand visibility query — used by the sender after
                // app restart to check if an existing receiver session
                // is hidden behind the home screen.
                sendMessage(event.senderId, {
                    event: 'visibility',
                    isVisible: receiverVisible,
                    documentHidden: document.hidden,
                    ts: Date.now(),
                    processingMs: Date.now() - receivedAt
                });
            }

            else if (data.action === 'slideshow') {
                startSlideshow(data);
                sendMessage(event.senderId, {
                    event: 'slideshowStarted',
                    total: (data.images || []).length,
                    ts: Date.now(),
                    processingMs: Date.now() - receivedAt
                });
            }

            else if (data.action === 'slideshowControl') {
                slideshowControl(data.op);
            }

            else if (data.action === 'replace') {
                // Swap the image set without ending the Cast session.
                startSlideshow(data);
                sendMessage(event.senderId, {
                    event: 'slideshowReplaced',
                    total: (data.images || []).length,
                    ts: Date.now(),
                    processingMs: Date.now() - receivedAt
                });
            }

            else if (data.action === 'getSlideshowStatus') {
                sendMessage(event.senderId, {
                    event: 'slideshowStatus',
                    active: slideshow.active,
                    paused: slideshow.paused,
                    mode: slideshow.mode,
                    index: slideshow.index,
                    total: slideshow.images.length,
                    loops: slideshow.loopCount,
                    durationMs: slideshow.durationMs,
                    uptimeMs: slideshow.active ? (Date.now() - slideshow.startedAt) : 0,
                    heap: heapStats(),
                    ts: Date.now(),
                    processingMs: Date.now() - receivedAt
                });
            }

            else if (data.action === 'getInfo') {
                var dpr = window.devicePixelRatio || 1;
                // Report everything about the display pipeline so we can
                // diagnose portrait vs landscape rendering on different TVs.
                var screenInfo = {};
                try {
                    screenInfo.screenWidth = window.screen.width;
                    screenInfo.screenHeight = window.screen.height;
                    screenInfo.screenAvailWidth = window.screen.availWidth;
                    screenInfo.screenAvailHeight = window.screen.availHeight;
                    if (window.screen.orientation) {
                        screenInfo.orientationType = window.screen.orientation.type;
                        screenInfo.orientationAngle = window.screen.orientation.angle;
                    }
                    screenInfo.outerWidth = window.outerWidth;
                    screenInfo.outerHeight = window.outerHeight;
                    screenInfo.docWidth = document.documentElement.clientWidth;
                    screenInfo.docHeight = document.documentElement.clientHeight;
                } catch(e) {
                    screenInfo.error = e.message;
                }
                sendMessage(event.senderId, {
                    event: 'info',
                    width: Math.round(window.innerWidth * dpr),
                    height: Math.round(window.innerHeight * dpr),
                    rotation: currentRotation,
                    devicePixelRatio: dpr,
                    screen: screenInfo,
                    ts: Date.now(),
                    processingMs: Date.now() - receivedAt
                });
            }
        });

        context.addEventListener(cast.framework.system.EventType.READY, function() {
            console.log('PosterCue receiver ready');
        });

        // PosterCue is a non-media receiver (static images, not streaming).
        // Two timeouts must be addressed to prevent unexpected disconnects:
        //
        // 1. disableIdleTimeout: The Cast platform kills receivers after ~5 min
        //    when no active media session exists. Since PosterCue never plays
        //    media, the platform always considers it "idle." This disables that
        //    platform-level idle kill entirely. Google's docs: "should only be
        //    used for non-media apps" — which is exactly what PosterCue is.
        //
        // 2. maxInactivity: Sender↔receiver heartbeat timeout. How long the
        //    receiver waits without hearing from the sender app before closing.
        //    Set to 86400s (24 hours) so the session survives long periods
        //    between image pushes. Minimum is 5s (0 breaks connections).
        var options = new cast.framework.CastReceiverOptions();
        options.disableIdleTimeout = true;
        options.maxInactivity = 86400;
        context.start(options);
    </script>
</body>
</html>
